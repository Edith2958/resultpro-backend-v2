<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<title>ResultPro — Check Your Result</title>
<style>
  :root {
    color-scheme: light;
    --navy: #176345;
    --navy-light: #104d36;
    --gold: #d8ad55;
    --cream: #f4f7f5;
    --card: #ffffff;
    --border: #e2eae5;
    --text: #1d2c24;
    --text-soft: #718078;
    --pass: #18794e;
    --pass-bg: #e5f5ec;
    --fail: #b93838;
    --fail-bg: #fff0ef;
    --warn: #ce8e00;
    --warn-bg: #fff4d1;
    --shadow-md: 0 12px 34px rgba(24, 55, 39, .075);
    --radius-card: 18px;
    --radius-control: 11px;
    --ease-out-expo: cubic-bezier(.16,1,.3,1);
    --ease-out-back: cubic-bezier(.34,1.56,.64,1);
  }
  * { box-sizing: border-box; }
  html { min-height: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Nunito', Arial, sans-serif;
    background:
      radial-gradient(ellipse at 8% 0%, rgba(23, 99, 69, .06), transparent 32rem),
      linear-gradient(180deg, #f7faf8 0%, #f0f5f1 100%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 34px 18px 72px;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: 100%; max-width: 480px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes crestPop {
    0%   { opacity: 0; transform: scale(.6) rotate(-8deg); }
    60%  { opacity: 1; transform: scale(1.06) rotate(2deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  @keyframes rowArrive {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes viewSwap {
    from { opacity: 0; transform: translateY(16px) scale(.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-4px); }
    75%      { transform: translateX(4px); }
  }
  @keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(43,137,96,.22); transform: scale(1); }
    50%      { box-shadow: 0 0 0 6px rgba(43,137,96,.06); transform: scale(1.1); }
  }

  .school-header {
    text-align: center;
    margin-bottom: 24px;
    padding: 5px 12px 0;
    animation: fadeUp .55s var(--ease-out-expo) both;
  }
  .school-header .crest {
    width: 58px; height: 58px;
    background: linear-gradient(145deg, #247a56, #104b35);
    color: #f4d58e;
    border: 3px solid rgba(255,255,255,.92);
    border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 19px;
    margin: 0 auto 12px;
    overflow: hidden;
    box-shadow: 0 7px 18px rgba(16, 77, 54, .18);
    font-family: 'Baloo 2', sans-serif;
    animation: crestPop .6s var(--ease-out-back) both;
    animation-delay: .1s;
    transition: transform .3s var(--ease-out-back), box-shadow .3s ease;
  }
  .school-header .crest:hover {
    transform: scale(1.06) rotate(-3deg);
    box-shadow: 0 10px 24px rgba(16, 77, 54, .28);
  }
  .school-header .crest img { width: 100%; height: 100%; object-fit: cover; }
  .school-header h1 {
    font-size: clamp(21px, 3vw, 27px);
    margin: 0;
    font-weight: 800;
    font-family: 'Baloo 2', sans-serif;
    letter-spacing: -.35px;
    line-height: 1.2;
    color: #183d2d;
    animation: fadeUp .5s var(--ease-out-expo) .15s both;
  }
  .school-header p {
    font-size: 12px;
    color: var(--text-soft);
    margin: 6px 0 0;
    font-weight: 700;
    letter-spacing: .35px;
    animation: fadeUp .5s var(--ease-out-expo) .22s both;
  }
  .school-header .school-details {
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 4px;
    line-height: 1.4;
    animation: fadeUp .5s var(--ease-out-expo) .28s both;
  }

  .card {
    background: var(--card);
    border: 1px solid rgba(220, 231, 223, .95);
    border-radius: var(--radius-card);
    padding: 28px 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-md);
    animation: fadeUp .5s var(--ease-out-expo) .28s both;
  }
  .card.view-enter { animation: viewSwap .45s var(--ease-out-expo) both; }
  .card h2 {
    font-size: 16px;
    font-weight: 800;
    font-family: 'Baloo 2', sans-serif;
    margin: 0 0 18px;
    color: #183d2d;
    letter-spacing: -.2px;
  }

  label {
    font-size: 10px;
    color: #596c61;
    display: block;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .85px;
    font-weight: 900;
    line-height: 1.4;
  }
  input, select {
    width: 100%;
    padding: 11px 13px;
    font-size: 13px;
    border: 1px solid #dce6df;
    border-radius: var(--radius-control);
    margin-bottom: 14px;
    background: #fbfdfb;
    color: var(--text);
    font-family: inherit;
    font-weight: 700;
    outline: none;
    transition: border-color .2s var(--ease-out-expo), box-shadow .2s var(--ease-out-expo), background .2s var(--ease-out-expo), transform .2s var(--ease-out-back);
  }
  input::placeholder { color: #a1ada5; font-weight: 500; }
  input:hover, select:hover { border-color: #bdcfc2; }
  input:focus, select:focus {
    border-color: #31835d;
    background: #fff;
    box-shadow: 0 0 0 3px rgba(49, 131, 93, .12);
    transform: translateY(-1px);
  }
  input.invalid, select.invalid {
    border-color: var(--fail);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(185,56,56,.08);
    animation: shake .4s var(--ease-out-expo);
  }
  select { cursor: pointer; }

  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; min-width: 0; }

  button {
    width: 100%;
    padding: 12px 18px;
    font-family: 'Nunito', Arial, sans-serif;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .25px;
    border: 1px solid var(--navy);
    border-radius: 11px;
    background: linear-gradient(135deg, #237b55, #145b3d);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(23, 99, 69, .16);
    transition: transform .18s var(--ease-out-back), box-shadow .18s var(--ease-out-expo), background .18s ease, border-color .18s ease;
    position: relative;
    overflow: hidden;
  }
  button::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255,255,255,.25), transparent 60%);
    opacity: 0;
    transition: opacity .35s ease;
    pointer-events: none;
  }
  button:active::after { opacity: 1; transition: opacity 0s; }
  button:hover {
    background: linear-gradient(135deg, #2b8960, #176345);
    box-shadow: 0 8px 20px rgba(23, 99, 69, .26);
    transform: translateY(-2px);
  }
  button:active { transform: translateY(0) scale(.98); box-shadow: 0 2px 5px rgba(23, 99, 69, .15); }
  button:focus-visible { outline: 3px solid rgba(49, 131, 93, .28); outline-offset: 2px; }
  button.secondary {
    background: #f5faf6;
    color: var(--navy);
    border: 1px solid #dce9e0;
    box-shadow: none;
    margin-top: 10px;
  }
  button.secondary:hover {
    background: #eaf4ed;
    border-color: #bcd8c6;
    box-shadow: 0 4px 12px rgba(23, 99, 69, .08);
    transform: translateY(-1px);
  }
  button.secondary:active { transform: translateY(0) scale(.97); }

  .error-msg {
    font-size: 12px;
    color: var(--fail);
    background: var(--fail-bg);
    border: 1px solid #f3d0cd;
    border-radius: 10px;
    padding: 11px 13px;
    margin-bottom: 14px;
    display: none;
    font-weight: 800;
    animation: shake .4s var(--ease-out-expo);
  }

  #resultView { display: none; }

  .student-line {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
    animation: fadeUp .45s var(--ease-out-expo) .05s both;
  }
  .avatar {
    width: 48px; height: 48px;
    border-radius: 14px;
    background: linear-gradient(145deg, #e7f3ea, #d5e9db);
    color: #176345;
    border: 2px solid #e1eee5;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900;
    font-size: 14px;
    flex-shrink: 0;
    overflow: hidden;
    transition: transform .25s var(--ease-out-back);
  }
  .avatar:hover { transform: scale(1.05); }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .student-line .name { font-size: 15px; margin: 0; font-weight: 900; color: #203b2d; line-height: 1.3; }
  .student-line .meta { font-size: 12px; color: var(--text-soft); margin: 3px 0 0; font-weight: 600; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .stat-box {
    background: linear-gradient(145deg, #f0f8f3, #eaf4ee);
    border: 1px solid #e1eee5;
    border-radius: 12px;
    padding: 11px 13px;
    animation: fadeUp .4s var(--ease-out-expo) both;
    animation-delay: calc(var(--i, 0) * 60ms + 0.1s);
    transition: transform .2s var(--ease-out-back), box-shadow .2s ease;
  }
  .stat-box:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(23, 99, 69, .06); }
  .stat-box:nth-child(1) { --i: 0; }
  .stat-box:nth-child(2) { --i: 1; }
  .stat-box:nth-child(3) { --i: 2; }
  .stat-box:nth-child(4) { --i: 3; }
  .stat-box .label {
    font-size: 9px;
    color: #596c61;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: .85px;
    font-weight: 900;
    line-height: 1.4;
  }
  .stat-box .value { font-size: 15px; margin: 4px 0 0; font-weight: 900; color: #183d2d; line-height: 1.3; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin-bottom: 18px;
    animation: fadeUp .45s var(--ease-out-expo) .25s both;
  }
  th {
    text-align: left;
    color: #315542;
    background: #edf5ef;
    font-weight: 900;
    padding: 9px 6px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .4px;
    white-space: nowrap;
  }
  th:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; padding-left: 10px; }
  th:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; padding-right: 10px; }
  th.num, td.num { text-align: right; }
  td {
    padding: 10px 6px;
    border-bottom: 1px solid #edf1ee;
    color: #26372d;
    font-weight: 600;
    vertical-align: middle;
  }
  td:first-child { padding-left: 10px; font-weight: 700; }
  td:last-child { padding-right: 10px; }
  tr:last-child td { border-bottom: none; }
  tbody tr {
    animation: rowArrive .35s var(--ease-out-expo) both;
    animation-delay: calc(var(--i, 0) * 45ms + 0.3s);
    transition: background .15s ease;
  }
  tbody tr:hover td { background: #fbfdfb; }

  .grade-pill {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 7px;
    font-weight: 900;
    font-size: 11px;
    letter-spacing: .3px;
  }
  .grade-A, .grade-B { background: var(--pass-bg); color: var(--pass); }
  .grade-C, .grade-D, .grade-E { background: #fff4d1; color: #ce8e00; }
  .grade-F { background: var(--fail-bg); color: var(--fail); }

  .comments-block { animation: fadeUp .45s var(--ease-out-expo) .35s both; }
  .comments-block .comment-label {
    font-size: 10px;
    color: #596c61;
    text-transform: uppercase;
    letter-spacing: .85px;
    font-weight: 900;
    margin: 0 0 4px;
  }
  .comments-block p.comment-text {
    font-size: 13px;
    margin: 0 0 14px;
    color: #26372d;
    font-weight: 600;
    line-height: 1.55;
  }

  .verification-box {
    background: linear-gradient(145deg, #f8faf8, #f0f5f1);
    border: 1px dashed #d5e2d9;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    margin-bottom: 18px;
    animation: fadeUp .45s var(--ease-out-expo) .4s both;
  }
  .verification-box p { font-size: 12px; color: var(--text-soft); margin: 10px 0 0; font-weight: 700; }
  #qrcode { display: inline-block; padding: 10px; background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(24, 55, 39, .06); }

  .loading, .empty-state {
    font-size: 13px;
    color: var(--text-soft);
    text-align: center;
    padding: 24px 16px;
    font-weight: 700;
    animation: fadeUp .4s var(--ease-out-expo) both;
  }
  .loading::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--navy);
    margin-right: 8px;
    vertical-align: middle;
    animation: dotPulse 1.4s ease-in-out infinite;
  }
  #releaseCountdown { animation: fadeUp .4s var(--ease-out-expo) both; }

  /* Empty state extras */
  .empty-term-btn {
    width: 100%;
    text-align: left;
    margin: 0 0 8px;
    padding: 12px 14px;
    background: #f5faf6;
    border: 1px solid #dce9e0;
    border-radius: 11px;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .empty-term-btn:hover {
    background: #eaf4ed;
    border-color: #bcd8c6;
    transform: translateY(-1px);
  }

  @media (max-width: 500px) {
    body { padding: 20px 12px 56px; }
    .card { padding: 22px 18px; }
    .school-header .crest { width: 52px; height: 52px; border-radius: 16px; }
    .school-header h1 { font-size: 22px; }
    .avatar { width: 44px; height: 44px; border-radius: 12px; }
    th { font-size: 9px; padding: 8px 4px; }
    td { font-size: 11px; padding: 9px 4px; }
  }
  @media (max-width: 390px) {
    body { padding-right: 9px; padding-left: 9px; }
    .card { padding: 18px 14px; }
    .stat-grid { gap: 6px; }
    .stat-box { padding: 9px 10px; }
    .stat-box .value { font-size: 13px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
    }
  }

  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    html, body { background: #fff !important; padding: 0 !important; display: block !important; }
    .wrap { max-width: 100% !important; }
    #loginView, #loadingView, #emptyState, button, #releaseCountdown { display: none !important; }
    .school-header { margin-bottom: 16px; }
    .card {
      border: none !important;
      padding: 0 !important;
      box-shadow: none !important;
      margin: 0 !important;
      animation: none !important;
    }
    .verification-box { display: none !important; }
    .stat-box { border: 1px solid #ddd !important; background: #fafafa !important; }
    th { background: #eee !important; color: #333 !important; }
    td, th { border: 1px solid #ccc !important; color: #111 !important; }
    tbody tr { animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="school-header">
    <div class="crest" id="headerCrest">GS</div>
    <h1 id="headerSchoolName">ResultPro Academy</h1>
    <p id="headerSchoolMotto">Student result portal</p>
    <div class="school-details" id="headerSchoolDetails"></div>
  </div>

  <!-- LOGIN VIEW -->
  <div class="card" id="loginView">
    <h2>Check your result</h2>
    <div class="error-msg" id="loginError"></div>

    <label for="admissionNo">Admission number</label>
    <input type="text" id="admissionNo" placeholder="e.g. 245" autocomplete="off" />

    <label for="surname">Surname</label>
    <input type="text" id="surname" placeholder="e.g. Johnson" autocomplete="off" />

    <label for="resultType">Which result</label>
    <select id="resultType" style="margin-bottom:14px;" onchange="togglePinField()">
      <option value="fullterm">Full term result</option>
      <option value="midterm">Mid-term result</option>
    </select>

    <div id="pinFieldWrap">
      <label for="pinCode">Result PIN</label>
      <input type="text" id="pinCode" placeholder="e.g. 482-193-627" style="margin-bottom:14px;" autocomplete="off" />
    </div>

    <div class="row">
      <div>
        <label for="termSelect">Term</label>
        <select id="termSelect" onchange="checkReleaseCountdown()">
          <option>First Term</option>
          <option>Second Term</option>
          <option>Third Term</option>
        </select>
      </div>
      <div>
        <label for="sessionInput">Session</label>
        <input type="text" id="sessionInput" placeholder="2025/2026" value="2025/2026" onchange="checkReleaseCountdown()" oninput="checkReleaseCountdown()" />
      </div>
    </div>

    <p id="releaseCountdown" style="font-size:12px; color:var(--warn); margin:0 0 14px; display:none; font-weight:800;"></p>
    <button id="loginBtn" onclick="checkResult()">View result</button>
  </div>

  <!-- LOADING -->
  <div class="card" id="loadingView" style="display:none;">
    <p class="loading">Fetching result…</p>
  </div>

  <!-- EMPTY STATE (improved) -->
  <div class="card" id="emptyState" style="display:none;">
    <h2 style="margin-bottom:14px;">No result found</h2>
    <p id="emptyMessage" style="font-size:13px; color:var(--text-soft); margin:0 0 18px; font-weight:600;">
      There are no results yet for the term and session you selected.
    </p>
    <div id="emptyTermList"></div>
    <button class="secondary" onclick="backToLogin()" style="margin-top:16px;">Try a different term</button>
  </div>

  <!-- RESULT VIEW -->
  <div class="card" id="resultView">
    <div class="student-line">
      <div class="avatar" id="studentAvatar">--</div>
      <div>
        <p class="name" id="studentName">—</p>
        <p class="meta" id="studentMeta">—</p>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-box">
        <p class="label" id="statTotalLabel">Total score</p>
        <p class="value" id="statTotal">—</p>
      </div>
      <div class="stat-box">
        <p class="label" id="statAverageLabel">Average</p>
        <p class="value" id="statAverage">—</p>
      </div>
      <div class="stat-box">
        <p class="label" id="statPositionLabel">Class position</p>
        <p class="value" id="statPosition">—</p>
      </div>
      <div class="stat-box">
        <p class="label" id="statAttendanceLabel">Attendance</p>
        <p class="value" id="statAttendance">—</p>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Subject</th>
          <th class="num">CA</th>
          <th class="num">Exam</th>
          <th class="num">Total</th>
          <th class="num">Highest</th>
          <th class="num">Pos</th>
          <th class="num">Grade</th>
        </tr>
      </thead>
      <tbody id="subjectsBody"></tbody>
    </table>

    <div class="comments-block" id="commentsBlock"></div>

    <div class="verification-box" id="verificationBox" style="display:none;">
      <div id="qrcode"></div>
      <p id="pinUsageText"></p>
    </div>

    <div style="display:flex; gap:8px;">
      <button class="secondary" onclick="window.print()" style="flex:1;">Print / Save as PDF</button>
      <button class="secondary" onclick="backToLogin()" style="flex:1;">Check another result</button>
    </div>
  </div>

</div>

<script>
  const API_BASE = window.location.origin;
  let releaseCountdownInterval;

  async function fetchInitialSchoolSettings() {
    try {
      const res = await fetch(`${API_BASE}/api/settings`);
      const data = await res.json();
      if (data.settings) {
        updateSchoolHeader(data.settings);
      }
    } catch (err) {
      console.error('Could not load school settings for header:', err);
    }
  }
  fetchInitialSchoolSettings();

  function updateSchoolHeader(school) {
    if (!school) return;
    if (school.school_name) {
      document.getElementById('headerSchoolName').textContent = school.school_name;
    }
    if (school.motto) {
      document.getElementById('headerSchoolMotto').textContent = school.motto;
    }
    const detailsParts = [];
    if (school.school_address) detailsParts.push(school.school_address);
    if (school.school_phone) detailsParts.push(`Phone: ${school.school_phone}`);
    if (school.school_email) detailsParts.push(`Email: ${school.school_email}`);
    const detailsEl = document.getElementById('headerSchoolDetails');
    detailsEl.innerHTML = detailsParts.length > 0 ? detailsParts.join(' &middot; ') : '';
    const crestEl = document.getElementById('headerCrest');
    if (school.logo_url) {
      crestEl.innerHTML = `<img src="${getPhotoUrl(school.logo_url)}" alt="Logo" />`;
    } else if (school.school_name) {
      crestEl.textContent = school.school_name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
    }
  }

  function getInitials(name) {
    return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  }

  function getPhotoUrl(photoUrl) {
    if (!photoUrl) return '';
    if (photoUrl.startsWith('http://') || photoUrl.startsWith('https://')) return photoUrl;
    return `${API_BASE}${photoUrl}`;
  }

  function togglePinField() {
    const isFullTerm = document.getElementById('resultType').value === 'fullterm';
    document.getElementById('pinFieldWrap').style.display = isFullTerm ? 'block' : 'none';
    checkReleaseCountdown();
  }
  togglePinField();

  async function checkReleaseCountdown() {
    clearInterval(releaseCountdownInterval);
    const el = document.getElementById('releaseCountdown');
    const isFullTerm = document.getElementById('resultType').value === 'fullterm';
    const term = document.getElementById('termSelect').value;
    const session = document.getElementById('sessionInput').value.trim();
    if (!isFullTerm || !session) {
      el.style.display = 'none';
      return;
    }
    try {
      const res = await fetch(`${API_BASE}/api/term-settings?term=${encodeURIComponent(term)}&session=${encodeURIComponent(session)}`);
      const data = await res.json();
      const releaseAt = data.settings?.result_release_at;
      if (!releaseAt || new Date(releaseAt) <= new Date()) {
        el.style.display = 'none';
        return;
      }
      const releaseDate = new Date(releaseAt);
      el.style.display = 'block';
      function tick() {
        const diff = releaseDate - new Date();
        if (diff <= 0) {
          el.textContent = `🎉 Results are now available!`;
          clearInterval(releaseCountdownInterval);
          return;
        }
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const mins = Math.floor((diff / (1000 * 60)) % 60);
        const secs = Math.floor((diff / 1000) % 60);
        el.textContent = `⏳ Results open in ${days}d ${hours}h ${mins}m ${secs}s`;
      }
      tick();
      releaseCountdownInterval = setInterval(tick, 1000);
    } catch (err) {
      el.style.display = 'none';
    }
  }

  function showError(message) {
    const el = document.getElementById('loginError');
    el.textContent = message;
    el.style.display = 'block';
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
  }

  function hideError() {
    document.getElementById('loginError').style.display = 'none';
  }

  function validateInputs(admissionNo, surname, session, resultType, pinCode) {
    let valid = true;
    const markInvalid = (id) => {
      const el = document.getElementById(id);
      if (el) {
        el.classList.add('invalid');
        el.addEventListener('input', () => el.classList.remove('invalid'), { once: true });
        el.addEventListener('change', () => el.classList.remove('invalid'), { once: true });
      }
      valid = false;
    };
    if (!admissionNo) markInvalid('admissionNo');
    if (!surname) markInvalid('surname');
    if (!session) markInvalid('sessionInput');
    if (resultType === 'fullterm' && !pinCode) markInvalid('pinCode');
    return valid;
  }

  async function renderEmptyState(studentId, attemptedTerm, attemptedSession) {
    const emptyState = document.getElementById('emptyState');
    const message = document.getElementById('emptyMessage');
    const termList = document.getElementById('emptyTermList');

    message.textContent = `No results found for ${attemptedTerm}, ${attemptedSession}.`;
    termList.innerHTML = '';
    emptyState.style.display = 'block';

    try {
      const res = await fetch(`${API_BASE}/api/student/available-terms?student_id=${studentId}`);
      if (!res.ok) return;
      const data = await res.json();

      if (!data.terms || data.terms.length === 0) {
        message.textContent = `You don't have any results available yet. Check back after ${data.active.term}, ${data.active.session} results are released.`;
        return;
      }

      const availableTerms = data.terms.filter(t => !(t.term === attemptedTerm && t.session === attemptedSession));

      if (availableTerms.length === 0) {
        message.textContent = `That's the only term with results so far — and it hasn't been released yet.`;
        if (data.terms[0]?.result_release_at) {
          const releaseDate = new Date(data.terms[0].result_release_at);
          const releaseEl = document.createElement('p');
          releaseEl.style.cssText = 'font-size:12px; color:var(--warn); font-weight:800; margin:8px 0 0;';
          releaseEl.textContent = `Results release ${releaseDate.toLocaleString()}`;
          message.appendChild(releaseEl);
        }
        return;
      }

      const intro = document.createElement('p');
      intro.style.cssText = 'font-size:11px; color:#596c61; text-transform:uppercase; letter-spacing:.85px; font-weight:900; margin:0 0 8px;';
      intro.textContent = 'Try one of these instead';
      termList.appendChild(intro);

      availableTerms.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'empty-term-btn';
        btn.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <span style="font-weight:800; color:var(--navy);">${t.term}, ${t.session}</span>
            <span style="font-size:11px; font-weight:900; padding:3px 8px; border-radius:6px;
              ${t.is_released ? 'background:var(--pass-bg); color:var(--pass);' : 'background:var(--warn-bg); color:var(--warn);'}">
              ${t.is_released ? 'Available' : 'Not released'}
            </span>
          </div>
        `;
        btn.onclick = () => {
          document.getElementById('termSelect').value = t.term;
          document.getElementById('sessionInput').value = t.session;
          document.getElementById('emptyState').style.display = 'none';
          document.getElementById('loginView').style.display = 'block';
          checkReleaseCountdown();
        };
        termList.appendChild(btn);
      });
    } catch (err) {
      console.error('Failed to load available terms:', err);
    }
  }

  async function checkResult() {
    hideError();
    const admissionNo = document.getElementById('admissionNo').value.trim();
    const surname = document.getElementById('surname').value.trim();
    const term = document.getElementById('termSelect').value;
    const session = document.getElementById('sessionInput').value.trim();
    const resultType = document.getElementById('resultType').value;
    const pinCode = document.getElementById('pinCode').value.trim();

    if (!validateInputs(admissionNo, surname, session, resultType, pinCode)) {
      if (!admissionNo || !surname || !session) {
        showError('Please fill in admission number, surname and session.');
      } else if (resultType === 'fullterm' && !pinCode) {
        showError('Please enter your result PIN to view the full-term result.');
      }
      return;
    }

    document.getElementById('loginView').style.display = 'none';
    document.getElementById('loadingView').style.display = 'block';

    try {
      const loginRes = await fetch(`${API_BASE}/api/student/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ admission_no: admissionNo, surname }),
      });
      const loginData = await loginRes.json();

      if (!loginRes.ok) {
        throw new Error(loginData.error || 'Could not find that student.');
      }

      const student = loginData.student;
      const endpoint = resultType === 'midterm' ? 'midterm-result' : 'result';
      const pinParam = resultType === 'fullterm' ? `&pin_code=${encodeURIComponent(pinCode)}` : '';
      const resultRes = await fetch(
        `${API_BASE}/api/student/${endpoint}?student_id=${student.id}&term=${encodeURIComponent(term)}&session=${encodeURIComponent(session)}${pinParam}`
      );
      const resultData = await resultRes.json();

      document.getElementById('loadingView').style.display = 'none';

      if (resultRes.status === 403 && resultData.result_release_at) {
        const releaseDate = new Date(resultData.result_release_at);
        showError(`Results aren't released yet. They'll be available from ${releaseDate.toLocaleString()}.`);
        document.getElementById('loginView').style.display = 'block';
        return;
      }
      if (resultRes.status === 403 && resultData.fee_hold) {
        showError(resultData.error);
        document.getElementById('loginView').style.display = 'block';
        return;
      }
      if (resultRes.status === 403 && resultData.error) {
        showError(resultData.error);
        document.getElementById('loginView').style.display = 'block';
        return;
      }
      if (!resultRes.ok || !resultData.subjects || resultData.subjects.length === 0) {
        document.getElementById('loginView').style.display = 'block';
        await renderEmptyState(student.id, term, session);
        return;
      }

      if (resultData.school) updateSchoolHeader(resultData.school);

      if (resultType === 'midterm') {
        renderMidTermResult(resultData);
      } else {
        renderResult(resultData);
      }
    } catch (err) {
      document.getElementById('loadingView').style.display = 'none';
      document.getElementById('loginView').style.display = 'block';
      showError(err.message || 'Something went wrong. Please try again.');
    }
  }

  function enterResultView() {
    const card = document.getElementById('resultView');
    if (!card) return;
    card.classList.remove('view-enter');
    void card.offsetWidth;
    card.classList.add('view-enter');
  }

  function renderResult(data) {
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';
    enterResultView();

    const avatarEl = document.getElementById('studentAvatar');
    if (data.student.photo_url) {
      avatarEl.innerHTML = `<img src="${getPhotoUrl(data.student.photo_url)}" alt="${data.student.name}" />`;
    } else {
      avatarEl.textContent = getInitials(data.student.name);
    }
    document.getElementById('studentName').textContent = data.student.name;
    document.getElementById('studentMeta').textContent =
      `${data.student.class} · Admission no. ${data.student.admission_no} · ${data.term}, ${data.session}`;

    document.getElementById('statTotalLabel').textContent = 'Total score';
    document.getElementById('statAverageLabel').textContent = 'Average';
    document.getElementById('statPositionLabel').textContent = 'Class position';
    document.getElementById('statAttendanceLabel').textContent = 'Attendance';
    document.getElementById('statTotal').textContent = `${data.summary.total_score} / ${data.summary.max_obtainable}`;
    document.getElementById('statAverage').textContent = `${data.summary.average}%`;
    document.getElementById('statPosition').textContent = `${data.summary.class_position} of ${data.summary.class_size}`;
    document.getElementById('statAttendance').textContent = data.attendance
      ? `${data.attendance.present} / ${data.attendance.total_days}`
      : 'Not recorded';

    const tbody = document.getElementById('subjectsBody');
    tbody.innerHTML = '';
    data.subjects.forEach((s, i) => {
      const tr = document.createElement('tr');
      tr.style.setProperty('--i', i);
      tr.innerHTML = `
        <td>${s.subject_name}</td>
        <td class="num">${s.ca}</td>
        <td class="num">${s.exam}</td>
        <td class="num"><strong>${s.total}</strong></td>
        <td class="num">${s.highest ?? '—'}</td>
        <td class="num">${s.position ?? '—'}</td>
        <td class="num"><span class="grade-pill grade-${s.grade}">${s.grade || '—'}</span></td>
      `;
      tbody.appendChild(tr);
    });

    const commentsBlock = document.getElementById('commentsBlock');
    if (data.comments && (data.comments.form_teacher || data.comments.principal)) {
      commentsBlock.innerHTML = `
        ${data.comments.form_teacher ? `
          <p class="comment-label">Form teacher's comment</p>
          <p class="comment-text">${data.comments.form_teacher}</p>` : ''}
        ${data.comments.principal ? `
          <p class="comment-label">Principal's comment</p>
          <p class="comment-text">${data.comments.principal}</p>` : ''}
      `;
    } else {
      commentsBlock.innerHTML = '';
    }

    if (data.pin_usage) {
      document.getElementById('verificationBox').style.display = 'block';
      const qrcodeContainer = document.getElementById('qrcode');
      qrcodeContainer.innerHTML = '';
      const verificationText = `Verified: ${data.student.name} (${data.student.admission_no}) - Result PIN: ${data.pin_usage.code}`;
      new QRCode(qrcodeContainer, {
        text: verificationText,
        width: 110,
        height: 110,
      });
      document.getElementById('pinUsageText').textContent =
        `PIN Usage: ${data.pin_usage.uses_count} of ${data.pin_usage.max_uses} used`;
    }
  }

  function renderMidTermResult(data) {
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';
    document.getElementById('verificationBox').style.display = 'none';
    enterResultView();

    const avatarEl = document.getElementById('studentAvatar');
    if (data.student.photo_url) {
      avatarEl.innerHTML = `<img src="${getPhotoUrl(data.student.photo_url)}" alt="${data.student.name}" />`;
    } else {
      avatarEl.textContent = getInitials(data.student.name);
    }
    document.getElementById('studentName').textContent = data.student.name;
    document.getElementById('studentMeta').textContent =
      `${data.student.class} · Admission no. ${data.student.admission_no} · ${data.term}, ${data.session} (Mid-term)`;

    document.getElementById('statTotalLabel').textContent = 'Passed';
    document.getElementById('statAverageLabel').textContent = 'Average';
    document.getElementById('statPositionLabel').textContent = 'Class position';
    document.getElementById('statAttendanceLabel').textContent = 'Attendance';
    const passed = data.subjects.filter(s => s.remark === 'Pass').length;
    document.getElementById('statTotal').textContent = `${passed} / ${data.subjects.length} passed`;
    document.getElementById('statAverage').textContent = '—';
    document.getElementById('statPosition').textContent = '—';
    document.getElementById('statAttendance').textContent = '—';

    const tbody = document.getElementById('subjectsBody');
    tbody.innerHTML = '';
    document.querySelector('#resultView thead').innerHTML = `
      <tr>
        <th>Subject</th>
        <th class="num">Assignment</th>
        <th class="num">Test</th>
        <th class="num">Total</th>
        <th class="num">Remark</th>
      </tr>`;

    data.subjects.forEach((s, i) => {
      const tr = document.createElement('tr');
      tr.style.setProperty('--i', i);
      const remarkClass = s.remark === 'Pass' ? 'grade-A' : s.remark === 'Fail' ? 'grade-F' : '';
      tr.innerHTML = `
        <td>${s.subject_name}</td>
        <td class="num">${s.assignment ?? '—'}</td>
        <td class="num">${s.test ?? '—'}</td>
        <td class="num"><strong>${s.total ?? '—'}</strong></td>
        <td class="num"><span class="grade-pill ${remarkClass}">${s.remark || '—'}</span></td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('commentsBlock').innerHTML = '';
  }

  function backToLogin() {
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('loginView').style.display = 'block';
    const loginCard = document.getElementById('loginView');
    loginCard.classList.remove('view-enter');
    void loginCard.offsetWidth;
    loginCard.classList.add('view-enter');
  }
</script>
</body>
</html>
