<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<title id="pageTitle">Teacher — Enter Scores</title>
<style>
  :root {
    color-scheme: light;
    --navy: #176345;
    --navy-light: #104d36;
    --gold: #d8ad55;
    --cream: #f4f7f5;
    --card: #ffffff;
    --border: #e2eae5;
    --text: #1d2c24;
    --text-soft: #718078;
    --pass: #18794e;
    --pass-bg: #e5f5ec;
    --fail: #b93838;
    --fail-bg: #fff0ef;
    --warn: #ce8e00;
    --warn-bg: #fff4d1;
    --surface-soft: #f8faf8;
    --shadow-sm: 0 2px 8px rgba(24, 55, 39, .045);
    --shadow-md: 0 12px 34px rgba(24, 55, 39, .075);
    --radius-card: 18px;
    --radius-control: 11px;
    --ease-out-expo: cubic-bezier(.16,1,.3,1);
    --ease-out-back: cubic-bezier(.34,1.56,.64,1);
    --sec-btn-bg: #f5faf6;
    --sec-btn-border: #dce9e0;
  }

  [data-theme="dark"] {
    color-scheme: dark;
    --navy: #2b8960;
    --navy-light: #1f6a48;
    --gold: #e6c477;
    --cream: #1a2420;
    --card: #232f29;
    --border: #364740;
    --text: #e6eeea;
    --text-soft: #9caea4;
    --pass: #6fcf97;
    --pass-bg: #1f3d2c;
    --fail: #e77;
    --fail-bg: #3d2222;
    --warn: #e0b85c;
    --warn-bg: #3a2f18;
    --surface-soft: #253029;
    --shadow-md: 0 12px 34px rgba(0,0,0,.35);
    --sec-btn-bg: #2a3833;
    --sec-btn-border: #364740;
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 34px 18px 72px;
    background: radial-gradient(ellipse at 8% 0%, rgba(23, 99, 69, .075), transparent 32rem), linear-gradient(180deg, var(--cream) 0%, var(--cream) 100%);
    color: var(--text);
    font-family: 'Nunito', Arial, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    transition: background .3s ease, color .3s ease;
  }
  button, input, select, textarea { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  .wrap { width: min(100%, 900px); margin: 0 auto; }
  .wrap.narrow { width: min(100%, 440px); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes crestPop { 0% { opacity: 0; transform: scale(.6) rotate(-8deg); } 60% { opacity: 1; transform: scale(1.06) rotate(2deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
  @keyframes rowArrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes viewSwap { from { opacity: 0; transform: translateY(16px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes dotPulse { 0%, 100% { box-shadow: 0 0 0 2px rgba(43,137,96,.22); transform: scale(1); } 50% { box-shadow: 0 0 0 6px rgba(43,137,96,.06); transform: scale(1.1); } }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

  .school-header { text-align: center; margin: 0 auto 25px; padding: 5px 12px 0; animation: fadeUp .55s var(--ease-out-expo) both; }
  .school-header .crest {
    width: 58px; height: 58px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center;
    overflow: hidden; border: 3px solid rgba(255,255,255,.92); border-radius: 18px;
    background: linear-gradient(145deg, #247a56, #104b35); color: #f4d58e;
    box-shadow: 0 7px 18px rgba(16, 77, 54, .18); font-family: 'Baloo 2', sans-serif; font-size: 19px; font-weight: 800;
    animation: crestPop .6s var(--ease-out-back) both; animation-delay: .1s;
  }
  .school-header .crest img { width: 100%; height: 100%; object-fit: cover; }
  .school-header h1 { margin: 0; color: var(--text); font-family: 'Baloo 2', sans-serif; font-size: clamp(21px, 3vw, 27px); font-weight: 800; letter-spacing: -.35px; animation: fadeUp .5s var(--ease-out-expo) .15s both; }
  .school-header p { margin: 6px 0 0; color: var(--text-soft); font-size: 12px; font-weight: 700; letter-spacing: .35px; animation: fadeUp .5s var(--ease-out-expo) .22s both; }

  .card { margin: 0 0 20px; padding: 24px; border: 1px solid var(--border); border-radius: var(--radius-card); background: var(--card); box-shadow: var(--shadow-md); animation: fadeUp .5s var(--ease-out-expo) .28s both; transition: background .3s ease, border-color .3s ease; }
  #loginWrap .card { padding: 30px; }
  #loginWrap .school-header { margin-bottom: 26px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); color: var(--text-soft); font-size: 13px; }
  .topbar .who { color: var(--text); font-weight: 700; }
  .topbar button { padding: 7px 12px; border: 1px solid var(--sec-btn-border); border-radius: 9px; background: var(--sec-btn-bg); color: var(--navy); font-size: 12px; font-weight: 800; cursor: pointer; transition: background .18s ease; }
  .topbar button:hover { background: var(--border); }

  .dash-greeting { margin: 0 0 18px; padding: 18px 22px; border-radius: 16px; background: linear-gradient(135deg, var(--surface-soft) 0%, var(--card) 100%); border: 1px solid var(--border); box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 4px 14px rgba(0,0,0,.05); display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; animation: fadeUp .5s var(--ease-out-back) both; }
  .dash-greeting .greet-line { font-family: 'Baloo 2', sans-serif; font-size: clamp(18px, 2.6vw, 22px); font-weight: 800; color: var(--text); letter-spacing: -.3px; }
  .dash-greeting .greet-sub { color: var(--text-soft); font-size: 12px; font-weight: 700; white-space: nowrap; }
  .dash-greeting .greet-sub .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--navy); margin-right: 6px; vertical-align: middle; animation: dotPulse 2.4s ease-in-out infinite; }

  label { display: block; margin: 0 0 6px; color: var(--text-soft); font-size: 10px; font-weight: 900; letter-spacing: .85px; line-height: 1.4; text-transform: uppercase; }
  input, select, textarea { width: 100%; min-width: 0; padding: 11px 13px; border: 1px solid var(--border); border-radius: var(--radius-control); outline: none; background: var(--surface-soft); color: var(--text); font-family: inherit; font-size: 13px; font-weight: 700; transition: all .2s ease; }
  input:focus, select:focus, textarea:focus { border-color: var(--navy); background: var(--card); box-shadow: 0 0 0 3px rgba(49, 131, 93, .12); }
  
  .filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-items: end; }
  @media (max-width: 700px) { .filters { grid-template-columns: 1fr; } }

  button.primary, button.ghost { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 39px; font-family: 'Nunito', Arial, sans-serif; font-size: 12px; font-weight: 900; cursor: pointer; transition: all .18s var(--ease-out-back); }
  button.primary { padding: 11px 19px; border: 1px solid var(--navy); border-radius: 11px; background: linear-gradient(135deg, #237b55, #145b3d); color: #fff; box-shadow: 0 4px 10px rgba(23, 99, 69, .16); }
  button.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(23, 99, 69, .26); }
  button.primary:active { transform: translateY(0) scale(.98); }
  button.primary:disabled { opacity: .55; cursor: not-allowed; }
  button.ghost { padding: 9px 15px; border: 1px solid var(--border); border-radius: 10px; background: transparent; color: var(--navy); }
  button.ghost:hover { background: var(--sec-btn-bg); transform: translateY(-1px); }

  .load-btn-row { margin-top: 16px; }
  .save-row { display: flex; gap: 10px; margin-top: 22px; }

  .error-msg { display: none; margin: 0 0 16px; padding: 11px 13px; border: 1px solid var(--fail); border-radius: 10px; background: var(--fail-bg); color: var(--fail); font-size: 12px; font-weight: 800; }

  .mode-toggle { display: flex; gap: 6px; margin-bottom: 18px; background: var(--surface-soft); border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
  .mode-toggle button { flex: 1; padding: 9px; border: none; border-radius: 8px; background: transparent; color: var(--text-soft); font-size: 13px; font-weight: bold; cursor: pointer; }
  .mode-toggle button.active { background: var(--card); color: var(--navy); box-shadow: 0 2px 6px rgba(0,0,0,.05); }

  .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px; color: var(--text-soft); }
  .badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 900; text-transform: uppercase; }
  .badge-draft { background: var(--warn-bg); color: var(--warn); }
  .badge-ready { background: var(--pass-bg); color: var(--pass); }

  /* Desktop Table */
  .desktop-table { width: 100%; border-collapse: collapse; font-size: 13px; display: table; }
  th { text-align: left; color: var(--text-soft); font-weight: 900; font-size: 10px; text-transform: uppercase; letter-spacing: .5px; padding: 12px 6px; border-bottom: 1px solid var(--border); }
  th.num, td.num { text-align: right; }
  td { padding: 10px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  td .student-name { font-weight: 800; color: var(--text); }
  td .student-flag { font-size: 10px; color: var(--warn); margin-top: 2px; font-weight: 700; }

  /* Mobile Cards */
  .mobile-cards { display: none; flex-direction: column; gap: 12px; }
  .m-card { background: var(--surface-soft); border: 1px solid var(--border); border-radius: 12px; padding: 14px; animation: rowArrive .4s var(--ease-out-expo) both; animation-delay: calc(var(--i) * 40ms); }
  .m-card-head { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 800; font-size: 14px; color: var(--text); }
  .m-card-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .m-card-grid label { font-size: 9px; margin-bottom: 4px; }

  .score-input { width: 100%; padding: 8px 10px; text-align: right; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-weight: 700; background: var(--card); color: var(--text); }
  .score-input:focus { border-color: var(--navy); outline: none; }
  .score-input:disabled { background: var(--surface-soft); color: var(--text-soft); border-style: dashed; }

  .remark-pass { color: var(--pass); font-weight: 800; font-size: 11px; }
  .remark-fail { color: var(--fail); font-weight: 800; font-size: 11px; }
  .grade-pill { display: inline-block; padding: 3px 8px; border-radius: 6px; font-weight: 900; font-size: 11px; }
  .grade-A, .grade-B { background: var(--pass-bg); color: var(--pass); }
  .grade-C, .grade-D, .grade-E { background: var(--warn-bg); color: var(--warn); }
  .grade-F { background: var(--fail-bg); color: var(--fail); }

  .empty-note { padding: 38px 16px; border: 1px dashed var(--border); border-radius: 13px; background: var(--surface-soft); color: var(--text-soft); font-size: 13px; font-weight: 700; text-align: center; }
  .skeleton-row { height: 50px; border-radius: 10px; background: linear-gradient(90deg, var(--surface-soft) 25%, var(--border) 50%, var(--surface-soft) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; margin-bottom: 10px; }

  .toast { position: fixed; z-index: 1000; right: 20px; bottom: 22px; left: 20px; width: fit-content; max-width: 520px; margin: 0 auto; padding: 14px 20px; border-radius: 12px; background: var(--navy); color: #fff; font-size: 13px; font-weight: 800; text-align: center; display: none; animation: fadeUp .3s var(--ease-out-back) both; }

  @media (max-width: 768px) {
    .desktop-table { display: none; }
    .mobile-cards { display: flex; }
  }

  @media (max-width: 600px) {
    body { padding: 20px 12px 56px; }
    .card { padding: 17px; margin-bottom: 14px; border-radius: 15px; }
    #loginWrap .card { padding: 22px 19px; }
    .save-row button { flex: 1 1 140px; }
  }

  /* PREMIUM RESULTPRO TEACHER EXPERIENCE */

    --navy: #176b4b;
    --navy-light: #10553b;
    --gold: #d6b16d;

    --card: #fff;
    --border: #e3ebe6;
    --text: #182920;
    --text-soft: #748279;
    --surface-soft: #f7faf8;
    --pass: #168653;
    --pass-bg: #e8f6ee;
    --fail: #c23f48;
    --fail-bg: #fff0f0;
    --warn: #a96e0b;
    --warn-bg: #fff6e2;
    --shadow-sm: 0 4px 14px rgba(20, 54, 37, .05);
    --shadow-md: 0 18px 50px rgba(20, 54, 37, .075);

    --text-soft: #a2b4a8;
    --surface-soft: #223229;
    --pass: #75d39d;

    --fail-bg: #402528;

  }

  html { scroll-behavior: smooth; scroll-padding-top: 22px; }
  body {
    padding: 42px 22px 82px;
    background:
      radial-gradient(ellipse at 5% 0%, rgba(35,126,84,.105), transparent 34rem),
      radial-gradient(ellipse at 96% 10%, rgba(214,177,109,.08), transparent 29rem),
      var(--cream);
    color: var(--text);
    font-family: "Nunito", system-ui, sans-serif;
    line-height: 1.6;
  }
  .wrap { width: min(100%, 1060px); }
  .wrap.narrow { width: min(100%, 460px); }
  .school-header { margin-bottom: 30px; }
  .school-header .crest {
    width: 66px; height: 66px; border: 4px solid var(--card);

  }
  .school-header h1 {

  #rosterCard { overflow: hidden; }

    margin-bottom: 15px; padding-bottom: 15px;
    border-bottom: 1px solid var(--border); font-weight: 800;
  }

  }

    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 18px; margin: 5px 0 17px;
  }

  .empty-note {
    padding: 48px 20px; border-radius: 16px; line-height: 1.7;

    bottom: 26px; padding: 13px 19px; border-radius: 14px;
    box-shadow: 0 12px 35px rgba(0,0,0,.2);
  }
  #passwordModal {
    backdrop-filter: blur(6px);
    background: rgba(10,24,17,.58) !important;
  }
  #passwordModal > div {
    max-width: 430px !important; padding: 28px !important;
    border-radius: 20px !important;
    box-shadow: 0 24px 70px rgba(0,0,0,.24) !important;
  }
  #passwordModal h3 { font-size: 22px; letter-spacing: -.4px; }
  #passwordModal input { margin-top: 6px; }

  @media (min-width: 900px) {
    .filters { grid-template-columns: 1.25fr .8fr .9fr; }
  }
  @media (max-width: 768px) {
    body { padding: 28px 16px 65px; }
    .card { padding: 22px; }
    .desktop-table { display: none; }
    .mobile-cards { display: flex; }
    .save-row { justify-content: stretch; }
    .save-row button { flex: 1 1 0; min-width: 0; }
    .roster-tools { align-items: stretch; flex-direction: column; }
    .roster-search-wrap { width: 100%; }
  }
  @media (max-width: 600px) {
    body { padding: 22px 12px 55px; }
    .school-header { margin-bottom: 22px; }
    .school-header .crest { width: 58px; height: 58px; border-radius: 18px; }
    .card, #loginWrap .card {
      padding: 19px; margin-bottom: 14px; border-radius: 16px;
    }
    .dash-greeting { padding: 16px; }
    .dash-greeting .greet-sub { white-space: normal; }
    .topbar { align-items: flex-start; flex-wrap: wrap; }
    .topbar > span:last-child { display: flex; flex-wrap: wrap; gap: 7px; }
    .topbar button { margin-left: 0 !important; }
    .filters { grid-template-columns: 1fr; gap: 13px; }
    .load-btn-row .primary { width: 100%; }
    .save-row { gap: 8px; }
    .save-row button { padding: 10px 8px; font-size: 11px; }
    .m-card-grid { gap: 7px; }
    .score-input { padding: 8px 6px; font-size: 12px; }
    #passwordModal > div { padding: 22px !important; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important; animation-duration: .01ms !important;
      animation-iteration-count: 1 !important; transition-duration: .01ms !important;
    }
  }

</style>
<script>
  (function() {
    try {
      var pref = localStorage.getItem('resultpro_theme');
      if (pref) document.documentElement.setAttribute('data-theme', pref);
    } catch (e) {}
  })();
</script>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="wrap narrow" id="loginWrap">
  <div class="school-header">
    <div class="crest" id="loginCrest">GS</div>
    <h1 id="loginSchoolName">School Portal</h1>
    <p>Teacher login</p>
  </div>
  <div class="card">
    <div class="error-msg" id="loginError"></div>
    <label for="teacherEmail">Email</label>
    <input type="email" id="teacherEmail" placeholder="e.g. adeyemi@school.com" />
    <label for="teacherPassword" style="margin-top:12px;">Password</label>
    <div style="position:relative; margin-bottom:16px;">
      <input type="password" id="teacherPassword" style="padding-right:64px;" />
      <button type="button" onclick="togglePasswordVisibility('teacherPassword', this)" style="position:absolute; right:6px; top:50%; transform:translateY(-50%); width:auto; padding:4px 10px; font-size:10px; background:var(--surface-soft); color:var(--navy); box-shadow:none; border:1px solid var(--border); border-radius:8px; text-transform:none; font-family:'Nunito',Arial,sans-serif; font-weight:700;">Show</button>
    </div>
    <button class="primary" style="width:100%;" onclick="login()">Log in</button>
  </div>
</div>

<!-- MAIN APP -->
<div class="wrap" id="appWrap" style="display:none;">
  <div class="school-header">
    <div class="crest" id="appCrest">GS</div>
    <h1 id="appSchoolName">School Portal</h1>
    <p>Teacher score entry</p>
  </div>

  <div class="card">
    <div class="dash-greeting" id="dashGreeting">
      <span class="greet-line" id="greetLine">Welcome back</span>
      <span class="greet-sub" id="greetSub"><span class="dot"></span>Logged in as <span id="whoAmISubtle">—</span></span>
    </div>

    <div class="topbar">
      <span class="who" id="whoAmI"></span>
      <span>
        <button onclick="logout()">Log out</button>
        <button onclick="openPasswordModal()" style="margin-left: 8px;">Change Password</button>
      </span>
    </div>

    <div class="mode-toggle">
      <button id="midTermTab" class="active" onclick="switchMode('midterm')">Mid-term</button>
      <button id="fullTermTab" onclick="switchMode('fullterm')">Full term</button>
    </div>

    <div class="filters">
      <div>
        <label for="assignmentSelect">Class &amp; subject</label>
        <select id="assignmentSelect"></select>
      </div>
      <div>
        <label for="termSelect">Term</label>
        <select id="termSelect" onchange="checkDeadlineCountdown()">
          <option>First Term</option>
          <option>Second Term</option>
          <option>Third Term</option>
        </select>
      </div>
      <div>
        <label for="sessionInput">Session</label>
        <input type="text" id="sessionInput" onchange="checkDeadlineCountdown()" oninput="checkDeadlineCountdown()" />
      </div>
    </div>

    <div class="load-btn-row">
      <button class="primary" onclick="loadRoster()">Load class</button>
    </div>

    <p id="deadlineCountdown" style="font-size:12px; color:var(--warn); margin:12px 0 0; display:none; font-weight:700;"></p>
  </div>

  <div class="card" id="rosterCard" style="display:none;">
    <div class="status-bar">
      <span id="scoredCount">0 of 0 students scored</span>
      <span class="badge badge-draft" id="statusBadge">Draft</span>
    </div>


    <div class="roster-tools" id="rosterTools">
      <div class="roster-tools-copy">
        <span class="roster-kicker">CLASS WORKSPACE</span>
        <strong>Student score sheet</strong>
        <span class="roster-hint">Enter scores and review results before submitting.</span>
      </div>
      <div class="roster-search-wrap">
        <span class="roster-search-icon" aria-hidden="true">⌕</span>
        <input id="studentSearch" type="search" placeholder="Find a student..." aria-label="Find a student" oninput="filterRoster()" />
        <span class="search-count" id="searchCount"></span>
      </div>
    </div>
    <div class="score-progress" id="scoreProgress" aria-live="polite">
      <div class="score-progress-top">
        <span id="progressLabel">Scoring progress</span>
        <strong id="progressPercent">0%</strong>
      </div>
      <div class="score-progress-track"><span id="progressFill"></span></div>
    </div>

    <!-- Desktop Table -->
    <table class="desktop-table">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>

    <!-- Mobile Cards -->
    <div class="mobile-cards" id="mobileCards"></div>

    <div class="save-row">
      <button class="ghost" onclick="saveScores('draft')">Save draft</button>
      <button class="primary" style="width:auto;" onclick="saveScores('final')">Submit final</button>
    </div>
  </div>

  <div class="empty-note" id="emptyNote" style="display:none;">
    No students found for that class yet.
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- PASSWORD MODAL -->
<div id="passwordModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; padding: 20px;">
  <div style="background: var(--card); width: 100%; max-width: 400px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 1px solid var(--border);">
    <h3 style="margin: 0 0 16px; font-family: 'Baloo 2', sans-serif; color: var(--text);">Change Password</h3>
    <label style="font-size: 11px; font-weight: 800; color: var(--text-soft); text-transform: uppercase;">Current Password</label>
    <input type="password" id="currentPass" style="width: 100%; margin-bottom: 12px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-soft); color: var(--text);" />
    <label style="font-size: 11px; font-weight: 800; color: var(--text-soft); text-transform: uppercase;">New Password</label>
    <input type="password" id="newPass" style="width: 100%; margin-bottom: 12px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-soft); color: var(--text);" />
    <label style="font-size: 11px; font-weight: 800; color: var(--text-soft); text-transform: uppercase;">Confirm New Password</label>
    <input type="password" id="confirmPass" style="width: 100%; margin-bottom: 20px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-soft); color: var(--text);" />
    <div style="display: flex; gap: 10px;">
      <button onclick="document.getElementById('passwordModal').style.display='none'" style="flex: 1; padding: 10px; border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 8px; cursor: pointer; font-weight: bold;">Cancel</button>
      <button onclick="submitPasswordChange()" class="primary" style="flex: 1; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold;">Save</button>
    </div>
  </div>
</div>

<script>
  const API_BASE = window.location.origin;
  let mode = 'midterm';
  let currentRoster = [];
  let myAssignments = [];
  let teacher = null;
  let countdownInterval;
  let greetingClockTimer;

  const urlParams = new URLSearchParams(window.location.search);
  const urlSchoolCode = urlParams.get('school');
  if (urlSchoolCode) {
    window.hiddenSchoolCode = urlSchoolCode.toUpperCase();
  }

  function getGreetingFor(hour) {
    if (hour >= 5  && hour < 12) return 'Good morning';
    if (hour >= 12 && hour < 17) return 'Good afternoon';
    if (hour >= 17 && hour < 22) return 'Good evening';
    return 'Welcome back';
  }

  function updateGreeting() {
    if (!teacher || !teacher.name) return;
    const firstName = teacher.name.trim().split(/\s+/)[0];
    const phrase = getGreetingFor(new Date().getHours());
    const lineEl = document.getElementById('greetLine');
    const subtleEl = document.getElementById('whoAmISubtle');
    const whoEl = document.getElementById('whoAmI');
    const newLine = `${phrase}, ${firstName}!`;
    
    if (lineEl && lineEl.textContent !== newLine) {
      lineEl.textContent = newLine;
    }
    if (subtleEl) subtleEl.textContent = teacher.name;
    if (whoEl) whoEl.textContent = `Logged in as ${teacher.name}`;
  }

  function startGreetingClock() {
    updateGreeting();
    if (greetingClockTimer) clearInterval(greetingClockTimer);
    greetingClockTimer = setInterval(updateGreeting, 60000);
  }

  async function fetchInitialSchoolSettings() {
    const code = window.hiddenSchoolCode;
    if (!code) return; 

    try {
      const lookup = await fetch(`${API_BASE}/api/developer/public/school-lookup?code=${code}`);
      if (!lookup.ok) return;
      const lookupData = await lookup.json();
      
      const res = await fetch(`${API_BASE}/api/settings?school_id=${lookupData.school.id}`);
      const data = await res.json();
      if (data.settings && data.settings.school_name) {
        const s = data.settings;
        document.getElementById('loginSchoolName').textContent = s.school_name;
        document.getElementById('appSchoolName').textContent = s.school_name;
        document.getElementById('pageTitle').textContent = `${s.school_name} — Teacher Score Entry`;
        
        [document.getElementById('loginCrest'), document.getElementById('appCrest')].forEach(crestEl => {
          if (!crestEl) return;
          if (s.logo_url) {
            crestEl.innerHTML = `<img src="${s.logo_url.startsWith('http') ? s.logo_url : API_BASE + s.logo_url}" alt="Logo" />`;
          } else {
            crestEl.textContent = s.school_name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
          }
        });
      }
    } catch (err) {
      console.error('Could not load school settings:', err);
    }
  }
  fetchInitialSchoolSettings();

  async function loadActiveSession() {
    try {
      const res = await fetch(`${API_BASE}/api/teacher/active-session`);
      const data = await res.json();
      if (data.session) document.getElementById('sessionInput').value = data.session;
      if (data.term) document.getElementById('termSelect').value = data.term;
    } catch (err) { console.error(err); }
  }

  const saved = sessionStorage.getItem('resultpro_teacher');
  if (saved) {
    teacher = JSON.parse(saved);
    boot();
  }

  function showToast(message) {
    const t = document.getElementById('toast');
    t.textContent = message;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2500);
  }

  document.addEventListener('keydown', function(event) {
    if (event.key === 'Enter' && document.getElementById('loginWrap').style.display !== 'none' &&
        (document.activeElement?.id === 'teacherEmail' || document.activeElement?.id === 'teacherPassword')) {
      login();
    }
    if (event.key === 'Escape') {
      const modal = document.getElementById('passwordModal');
      if (modal) modal.style.display = 'none';
    }
  });

  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === "password") { input.type = "text"; btn.textContent = "Hide"; }
    else { input.type = "password"; btn.textContent = "Show"; }
  }

  async function login() {
    const email = document.getElementById('teacherEmail').value.trim();
    const password = document.getElementById('teacherPassword').value;
    const school_code = window.hiddenSchoolCode || '';
    const errEl = document.getElementById('loginError');
    
    errEl.style.display = 'none';

    if (!email || !password) {
      errEl.textContent = 'Please enter both email and password.';
      errEl.style.display = 'block';
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/teacher/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, school_code }),
      });
      
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');

      teacher = data.teacher;
      sessionStorage.setItem('resultpro_teacher', JSON.stringify(teacher));
      boot();
    } catch (err) {
      errEl.textContent = err.message || 'Login failed.';
      errEl.style.display = 'block';
    }
  }

  function logout() {
    sessionStorage.removeItem('resultpro_teacher');
    if (greetingClockTimer) clearInterval(greetingClockTimer);
    teacher = null;
    document.getElementById('appWrap').style.display = 'none';
    document.getElementById('loginWrap').style.display = 'block';
  }

  async function boot() {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
    startGreetingClock();
    await loadActiveSession();

    try {
      const res = await fetch(`${API_BASE}/api/teacher/my-subjects?teacher_id=${teacher.id}`);
      const data = await res.json();
      myAssignments = data.assignments || [];

      const select = document.getElementById('assignmentSelect');
      if (myAssignments.length === 0) {
        select.innerHTML = `<option value="">No subjects assigned yet</option>`;
        return;
      }
      select.innerHTML = myAssignments
        .map((a, i) => `<option value="${i}">${a.class} — ${a.subject_name}</option>`)
        .join('');
      checkDeadlineCountdown();
    } catch (err) {
      showToast('Could not load your assigned subjects.');
    }
  }

  function checkDeadlineCountdown() {
    const term = document.getElementById('termSelect').value;
    const session = document.getElementById('sessionInput').value.trim();
    if (!session) return;
    updateDeadlineCountdown(term, session);
  }

  function switchMode(newMode) {
    mode = newMode;
    document.getElementById('midTermTab').classList.toggle('active', mode === 'midterm');
    document.getElementById('fullTermTab').classList.toggle('active', mode === 'fullterm');
    document.getElementById('rosterCard').style.display = 'none';
    document.getElementById('emptyNote').style.display = 'none';
  }

  function getFilters() {
    const idx = document.getElementById('assignmentSelect').value;
    const assignment = myAssignments[idx];
    return {
      className: assignment ? assignment.class : null,
      subjectId: assignment ? assignment.subject_id : null,
      term: document.getElementById('termSelect').value,
      session: document.getElementById('sessionInput').value.trim(),
    };
  }

  async function loadRoster() {
    const { className, subjectId, term, session } = getFilters();
    if (!className || !subjectId) { showToast('You have no subjects assigned yet.'); return; }
    if (!session) { showToast('Please enter a session.'); return; }

    updateDeadlineCountdown(term, session);

    const endpoint = mode === 'midterm' ? 'roster' : 'fullterm-roster';
    const url = `${API_BASE}/api/teacher/${endpoint}?class=${encodeURIComponent(className)}&subject_id=${subjectId}&term=${encodeURIComponent(term)}&session=${encodeURIComponent(session)}&teacher_id=${teacher.id}`;

    // Show loading skeletons
    document.getElementById('rosterCard').style.display = 'block';
    document.getElementById('emptyNote').style.display = 'none';
    const tableBody = document.getElementById('tableBody');
    const mobileCards = document.getElementById('mobileCards');
    const skeletonHTML = `<div class="skeleton-row"></div><div class="skeleton-row"></div><div class="skeleton-row"></div>`;
    tableBody.innerHTML = `<tr><td colspan="5">${skeletonHTML}</td></tr>`;
    mobileCards.innerHTML = skeletonHTML;

    try {
      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load class');

      currentRoster = data.roster || [];
      const searchInput = document.getElementById('studentSearch');
      if (searchInput) searchInput.value = '';
      if (currentRoster.length === 0) {
        document.getElementById('rosterCard').style.display = 'none';
        document.getElementById('emptyNote').style.display = 'block';
        return;
      }
      document.getElementById('emptyNote').style.display = 'none';
      renderRoster();
    } catch (err) {
      document.getElementById('rosterCard').style.display = 'none';
      showToast(err.message || 'Could not load class.');
    }
  }

  function renderRoster() {
    const head = document.getElementById('tableHead');
    const body = document.getElementById('tableBody');
    const mobile = document.getElementById('mobileCards');

    if (mode === 'midterm') {
      head.innerHTML = `<tr><th>Student</th><th class="num">Assignment (15)</th><th class="num">Test (15)</th><th class="num">Total</th><th class="num">Remark</th></tr>`;
      
      body.innerHTML = currentRoster.map((s, i) => `
        <tr data-idx="${i}">
          <td><span class="student-name">${s.name}</span></td>
          <td class="num"><input class="score-input" type="number" min="0" max="15" value="${s.assignment_score ?? ''}" oninput="updateMidTermRow(${i})" id="assignment-${i}" /></td>
          <td class="num"><input class="score-input" type="number" min="0" max="15" value="${s.test_score ?? ''}" oninput="updateMidTermRow(${i})" id="test-${i}" /></td>
          <td class="num total-cell" id="total-${i}">${s.total_score ?? '—'}</td>
          <td class="num"><span id="remark-${i}" class="${s.remark === 'Pass' ? 'remark-pass' : s.remark === 'Fail' ? 'remark-fail' : ''}">${s.remark ?? '—'}</span></td>
        </tr>`).join('');

      mobile.innerHTML = currentRoster.map((s, i) => `
        <div class="m-card" style="--i:${i}">
          <div class="m-card-head"><span>${s.name}</span> <span id="m-total-${i}" style="color:var(--navy);">${s.total_score ?? '—'}</span></div>
          <div class="m-card-grid">
            <div><label>Assignment (15)</label><input class="score-input" type="number" min="0" max="15" step="1" inputmode="numeric" id="m-assignment-${i}" value="${s.assignment_score ?? ''}" oninput="updateMidTermRow(${i})" /></div>
            <div><label>Test (15)</label><input class="score-input" type="number" min="0" max="15" step="1" inputmode="numeric" id="m-test-${i}" value="${s.test_score ?? ''}" oninput="updateMidTermRow(${i})" /></div>
            <div><label>Remark</label><div style="padding-top:8px;"><span id="m-remark-${i}" class="${s.remark === 'Pass' ? 'remark-pass' : s.remark === 'Fail' ? 'remark-fail' : ''}">${s.remark ?? '—'}</span></div></div>
          </div>
        </div>`).join('');
    } else {
      head.innerHTML = `<tr><th>Student</th><th class="num">CA (30)</th><th class="num">Exam (70)</th><th class="num">Total</th><th class="num">Grade</th></tr>`;
      
      body.innerHTML = currentRoster.map((s, i) => `
        <tr data-idx="${i}">
          <td><span class="student-name">${s.name}</span>${s.needs_manual_ca ? '<div class="student-flag">No mid-term record</div>' : ''}</td>
          <td class="num">${s.needs_manual_ca ? `<input class="score-input" type="number" min="0" max="30" value="${s.ca ?? ''}" oninput="updateFullTermRow(${i})" id="ca-${i}" />` : `<input class="score-input" type="number" value="${s.ca ?? 0}" disabled />`}</td>
          <td class="num"><input class="score-input" type="number" min="0" max="70" value="${s.exam_score ?? ''}" oninput="updateFullTermRow(${i})" id="exam-${i}" /></td>
          <td class="num total-cell" id="total-${i}">${s.total_score ?? '—'}</td>
          <td class="num" id="grade-${i}">${s.grade ? `<span class="grade-pill grade-${s.grade}">${s.grade}</span>` : '—'}</td>
        </tr>`).join('');

      mobile.innerHTML = currentRoster.map((s, i) => `
        <div class="m-card" style="--i:${i}">
          <div class="m-card-head"><span>${s.name}</span> <span id="m-total-${i}" style="color:var(--navy);">${s.total_score ?? '—'}</span></div>
          ${s.needs_manual_ca ? '<p style="font-size:10px; color:var(--warn); font-weight:700; margin:0 0 8px;">No mid-term record — enter CA manually</p>' : ''}
          <div class="m-card-grid" style="grid-template-columns: 1fr 1fr 1fr;">
            <div><label>CA (30)</label>${s.needs_manual_ca ? `<input class="score-input" type="number" min="0" max="30" step="1" inputmode="numeric" id="m-ca-${i}" value="${s.ca ?? ''}" oninput="updateFullTermRow(${i})" />` : `<input class="score-input" type="number" value="${s.ca ?? 0}" disabled />`}</div>
            <div><label>Exam (70)</label><input class="score-input" type="number" min="0" max="70" step="1" inputmode="numeric" id="m-exam-${i}" value="${s.exam_score ?? ''}" oninput="updateFullTermRow(${i})" /></div>
            <div><label>Grade</label><div style="padding-top:8px;" id="m-grade-${i}">${s.grade ? `<span class="grade-pill grade-${s.grade}">${s.grade}</span>` : '—'}</div></div>
          </div>
        </div>`).join('');
    }
    updateScoredCount();
    filterRoster();
  }

  function updateMidTermRow(i) {
    const desktopVisible = document.querySelector('.desktop-table').offsetParent !== null;
    const assignmentInput = document.getElementById(desktopVisible ? `assignment-${i}` : `m-assignment-${i}`);
    const testInput = document.getElementById(desktopVisible ? `test-${i}` : `m-test-${i}`);
    const assignment = assignmentInput ? assignmentInput.value : '';
    const test = testInput ? testInput.value : '';
    const hasAny = assignment !== '' || test !== '';
    const total = hasAny ? (Number(assignment) || 0) + (Number(test) || 0) : null;

    currentRoster[i].assignment_score = assignment === '' ? null : Number(assignment);
    currentRoster[i].test_score = test === '' ? null : Number(test);
    currentRoster[i].total_score = total;

    document.getElementById(`total-${i}`).textContent = total ?? '—';
    const mTotal = document.getElementById(`m-total-${i}`);
    if (mTotal) mTotal.textContent = total ?? '—';

    const remark = total === null ? '—' : (total >= 15 ? 'Pass' : 'Fail');
    const remarkEl = document.getElementById(`remark-${i}`);
    const mRemarkEl = document.getElementById(`m-remark-${i}`);
    if (remarkEl) {
      remarkEl.textContent = remark;
      remarkEl.className = remark === 'Pass' ? 'remark-pass' : remark === 'Fail' ? 'remark-fail' : '';
    }
    if (mRemarkEl) {
      mRemarkEl.textContent = remark;
      mRemarkEl.className = remark === 'Pass' ? 'remark-pass' : remark === 'Fail' ? 'remark-fail' : '';
    }
    updateScoredCount();
  }

  function getGrade(total) {
    if (total === null) return null;
    if (total >= 75) return 'A';
    if (total >= 65) return 'B';
    if (total >= 55) return 'C';
    if (total >= 45) return 'D';
    if (total >= 40) return 'E';
    return 'F';
  }

  function updateFullTermRow(i) {
    const desktopVisible = document.querySelector('.desktop-table').offsetParent !== null;
    const caInput = document.getElementById(desktopVisible ? `ca-${i}` : `m-ca-${i}`);
    const ca = caInput ? (caInput.value === '' ? null : Number(caInput.value)) : currentRoster[i].ca;
    const examInput = document.getElementById(desktopVisible ? `exam-${i}` : `m-exam-${i}`);
    const exam = examInput && examInput.value !== '' ? Number(examInput.value) : null;

    currentRoster[i].manual_ca_override = currentRoster[i].needs_manual_ca ? ca : null;
    currentRoster[i].exam_score = exam;
    const total = (ca !== null && exam !== null) ? ca + exam : null;
    currentRoster[i].total_score = total;

    document.getElementById(`total-${i}`).textContent = total ?? '—';
    const mTotal = document.getElementById(`m-total-${i}`);
    if (mTotal) mTotal.textContent = total ?? '—';

    const grade = getGrade(total);
    document.getElementById(`grade-${i}`).innerHTML = grade ? `<span class="grade-pill grade-${grade}">${grade}</span>` : '—';
    const mGrade = document.getElementById(`m-grade-${i}`);
    if (mGrade) mGrade.innerHTML = grade ? `<span class="grade-pill grade-${grade}">${grade}</span>` : '—';
    
    updateScoredCount();
  }


  function filterRoster() {
    const query = (document.getElementById('studentSearch')?.value || '').trim().toLowerCase();
    let visible = 0;
    document.querySelectorAll('#tableBody tr[data-idx], #mobileCards .m-card').forEach((row, index) => {
      const student = currentRoster[index];
      const name = (student?.name || '').toLowerCase();
      const show = !query || name.includes(query);
      row.style.display = show ? '' : 'none';
      if (show && (row.matches('tr') || window.innerWidth <= 768)) visible++;
    });
    const count = document.getElementById('searchCount');
    if (count) count.textContent = query ? `${visible} found` : `${currentRoster.length}`;
  }

  function updateScoredCount() {
    const scored = currentRoster.filter(s => s.total_score !== null && s.total_score !== undefined).length;
    document.getElementById('scoredCount').textContent = `${scored} of ${currentRoster.length} students scored`;
    const percent = currentRoster.length ? Math.round((scored / currentRoster.length) * 100) : 0;
    const label = document.getElementById('progressLabel');
    const percentEl = document.getElementById('progressPercent');
    const fill = document.getElementById('progressFill');
    if (label) label.textContent = `${scored} of ${currentRoster.length} students have scores`;
    if (percentEl) percentEl.textContent = `${percent}%`;
    if (fill) fill.style.width = `${percent}%`;
    const searchCount = document.getElementById('searchCount');
    if (searchCount) searchCount.textContent = `${currentRoster.length}`;
  }


  async function updateDeadlineCountdown(term, session) {
    clearInterval(countdownInterval);
    const el = document.getElementById('deadlineCountdown');
    try {
      const res = await fetch(`${API_BASE}/api/term-settings?term=${encodeURIComponent(term)}&session=${encodeURIComponent(session)}`);
      const data = await res.json();
      const deadline = data.settings?.teacher_deadline;
      if (!deadline) { el.style.display = 'none'; return; }
      const deadlineDate = new Date(deadline);
      el.style.display = 'block';
      function tick() {
        const diff = deadlineDate - new Date();
        if (diff <= 0) { el.textContent = `⏰ Deadline has passed (was ${deadlineDate.toLocaleString()})`; clearInterval(countdownInterval); return; }
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const mins = Math.floor((diff / (1000 * 60)) % 60);
        const secs = Math.floor((diff / 1000) % 60);
        el.textContent = `⏳ Score submission deadline: ${days}d ${hours}h ${mins}m ${secs}s remaining`;
      }
      tick();
      countdownInterval = setInterval(tick, 1000);
    } catch (err) { el.style.display = 'none'; }
  }

  async function saveScores(status) {
    const { className, subjectId, term, session } = getFilters();
    if (!currentRoster.length) {
      showToast('Load a class before saving scores.');
      return;
    }
    const invalidScore = currentRoster.some(s => {
      if (mode === 'midterm') {
        return (s.assignment_score != null && (!Number.isInteger(s.assignment_score) || s.assignment_score < 0 || s.assignment_score > 15)) ||
               (s.test_score != null && (!Number.isInteger(s.test_score) || s.test_score < 0 || s.test_score > 15));
      }
      return (s.exam_score != null && (!Number.isInteger(s.exam_score) || s.exam_score < 0 || s.exam_score > 70)) ||
             (s.manual_ca_override != null && (!Number.isInteger(s.manual_ca_override) || s.manual_ca_override < 0 || s.manual_ca_override > 30));
    });
    if (invalidScore) {
      showToast('Please check score values and allowed ranges.');
      return;
    }
    const endpoint = mode === 'midterm' ? 'midterm-scores' : 'fullterm-scores';
    const scores = mode === 'midterm'
      ? currentRoster.map(s => ({ student_id: s.student_id, assignment_score: s.assignment_score, test_score: s.test_score, status }))
      : currentRoster.map(s => ({ student_id: s.student_id, exam_score: s.exam_score, manual_ca_override: s.manual_ca_override, status }));

    try {
      const res = await fetch(`${API_BASE}/api/teacher/${endpoint}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ teacher_id: teacher.id, class: className, subject_id: subjectId, term, session, scores }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Save failed');
      document.getElementById('statusBadge').textContent = status === 'final' ? 'Final' : 'Draft';
      document.getElementById('statusBadge').className = `badge ${status === 'final' ? 'badge-ready' : 'badge-draft'}`;
      showToast(status === 'final' ? 'Scores submitted.' : 'Draft saved.');
    } catch (err) { showToast(err.message || 'Could not save scores.'); }
  }

  function openPasswordModal() {
    document.getElementById('passwordModal').style.display = 'flex';
    document.getElementById('currentPass').value = '';
    document.getElementById('newPass').value = '';
    document.getElementById('confirmPass').value = '';
  }

  async function submitPasswordChange() {
    const currentPass = document.getElementById('currentPass').value;
    const newPass = document.getElementById('newPass').value;
    const confirmPass = document.getElementById('confirmPass').value;

    if (!currentPass || !newPass || !confirmPass) return showToast('Please fill all fields.');
    if (newPass !== confirmPass) return showToast('New passwords do not match.');
    if (newPass.length < 6) return showToast('New password must be at least 6 characters.');

    try {
      const res = await fetch(`${API_BASE}/api/teacher/change-password`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ teacher_id: teacher.id, current_password: currentPass, new_password: newPass }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      showToast('Password changed successfully!');
      document.getElementById('passwordModal').style.display = 'none';
    } catch (err) { showToast(err.message || 'Failed to change password.'); }
  }
</script>
