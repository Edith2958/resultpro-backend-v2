<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<title id="pageTitle">Form Teacher — Roster &amp; Broadsheet</title>
<style>

:root {
  color-scheme: light;
  --navy: #176345;
  --navy-light: #104d36;
  --gold: #d8ad55;
  --cream: #f4f7f5;
  --card: #ffffff;
  --border: #e2eae5;
  --text: #1d2c24;
  --text-soft: #718078;
  --pass: #18794e;
  --pass-bg: #e5f5ec;
  --fail: #b93838;
  --fail-bg: #fff0ef;
  --surface-soft: #f8faf8;
  --shadow-sm: 0 2px 8px rgba(24, 55, 39, .045);
  --shadow-md: 0 12px 34px rgba(24, 55, 39, .075);
  --radius-card: 18px;
  --radius-control: 11px;

  /* motion tokens */
  --ease-out-expo: cubic-bezier(.16,1,.3,1);
  --ease-out-back: cubic-bezier(.34,1.56,.64,1);
  --ease-spring: cubic-bezier(.21,.98,.42,1);
}
* { box-sizing: border-box; }
html { min-height: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  padding: 34px 18px 72px;
  background:
    radial-gradient(ellipse at 8% 0%, rgba(31, 115, 79, .075), transparent 32rem),
    linear-gradient(180deg, #f7faf8 0%, #f0f5f1 100%);
  color: var(--text);
  font-family: 'Nunito', Arial, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
.wrap { width: min(100%, 900px); margin: 0 auto; }
.wrap.narrow { width: min(100%, 440px); }

/* ============================================
   ENTRANCE CHOREOGRAPHY
   ============================================ */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes crestPop {
  0%   { opacity: 0; transform: scale(.6) rotate(-8deg); }
  60%  { opacity: 1; transform: scale(1.06) rotate(2deg); }
  100% { opacity: 1; transform: scale(1) rotate(0); }
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes shimmer {
  0%   { background-position: -200% center; }
  100% { background-position: 200% center; }
}

.school-header {
  text-align: center;
  margin: 0 auto 25px;
  padding: 5px 12px 0;
  animation: fadeUp .55s var(--ease-out-expo) both;
}
.school-header .crest {
  width: 58px;
  height: 58px;
  margin: 0 auto 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 3px solid rgba(255,255,255,.92);
  border-radius: 18px;
  background: linear-gradient(145deg, #247a56, #104b35);
  color: #f4d58e;
  box-shadow: 0 7px 18px rgba(16, 77, 54, .18);
  font-family: 'Baloo 2', sans-serif;
  font-size: 19px;
  font-weight: 800;
  animation: crestPop .6s var(--ease-out-back) both;
  animation-delay: .1s;
  transition: transform .3s var(--ease-out-back), box-shadow .3s ease;
}
.school-header .crest:hover {
  transform: scale(1.06) rotate(-3deg);
  box-shadow: 0 10px 24px rgba(16, 77, 54, .28);
}
.school-header .crest img { width: 100%; height: 100%; object-fit: cover; }
.school-header h1 {
  margin: 0;
  color: #183d2d;
  font-family: 'Baloo 2', sans-serif;
  font-size: clamp(21px, 3vw, 27px);
  font-weight: 800;
  letter-spacing: -.35px;
  line-height: 1.2;
  animation: fadeUp .5s var(--ease-out-expo) .15s both;
}
.school-header p {
  margin: 6px 0 0;
  color: var(--text-soft);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .35px;
  animation: fadeUp .5s var(--ease-out-expo) .22s both;
}

.card {
  margin: 0 0 20px;
  padding: 24px;
  border: 1px solid rgba(220, 231, 223, .95);
  border-radius: var(--radius-card);
  background: var(--card);
  box-shadow: var(--shadow-md);
  animation: fadeUp .5s var(--ease-out-expo) .28s both;
}
#loginWrap .card { padding: 30px; }
#loginWrap .school-header { margin-bottom: 26px; }

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 15px;
  border-bottom: 1px solid var(--border);
  color: var(--text-soft);
  font-size: 13px;
}
.topbar .who { color: #53665b; font-weight: 700; }
.topbar button {
  padding: 7px 12px;
  border: 1px solid #dce9e0;
  border-radius: 9px;
  background: #f5faf6;
  color: var(--navy);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease, transform .18s ease;
}
.topbar button:hover { background: #eaf4ed; border-color: #bcd8c6; }
.topbar button:active { transform: translateY(1px); }

/* ============================================
   PERSONALISED GREETING — the hero moment
   ============================================ */
.dash-greeting {
  margin: 0 0 18px;
  padding: 18px 22px;
  border-radius: 16px;
  background: linear-gradient(135deg, #eef8f2 0%, #e2f1e9 55%, #f3f9f5 100%);
  border: 1px solid #d4e7da;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.9),
    0 4px 14px rgba(23, 99, 69, .07);
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px 12px;
  position: relative;
  overflow: hidden;
  animation: greetArrive .65s var(--ease-out-back) both;
}
@keyframes greetArrive {
  0%   { opacity: 0; transform: translateY(-12px) scale(.96); }
  60%  { opacity: 1; transform: translateY(2px) scale(1.01); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
/* subtle ambient sheen that sweeps once */
.dash-greeting::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg,
    transparent 30%,
    rgba(255,255,255,.35) 50%,
    transparent 70%);
  background-size: 200% 100%;
  animation: shimmer 1.6s var(--ease-out-expo) .35s 1 both;
  pointer-events: none;
}
.dash-greeting .greet-line {
  font-family: 'Baloo 2', sans-serif;
  font-size: clamp(18px, 2.6vw, 22px);
  font-weight: 800;
  color: #183d2d;
  letter-spacing: -.3px;
  line-height: 1.22;
  animation: fadeUp .5s var(--ease-out-expo) .3s both;
}
.dash-greeting .greet-sub {
  color: #4e6a5b;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .2px;
  white-space: nowrap;
  animation: fadeUp .5s var(--ease-out-expo) .42s both;
}
.dash-greeting .greet-sub .dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #2b8960;
  margin-right: 6px;
  vertical-align: middle;
  animation: dotPulse 2.4s ease-in-out infinite;
  animation-delay: .6s;
}
@keyframes dotPulse {
  0%, 100% { box-shadow: 0 0 0 2px rgba(43,137,96,.22); transform: scale(1); }
  50%      { box-shadow: 0 0 0 6px rgba(43,137,96,.06); transform: scale(1.1); }
}

/* ============================================
   FORMS & CONTROLS
   ============================================ */
label {
  display: block;
  margin: 0 0 6px;
  color: #596c61;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: .85px;
  line-height: 1.4;
  text-transform: uppercase;
}
input, select, textarea {
  width: 100%;
  min-width: 0;
  padding: 11px 13px;
  border: 1px solid #dce6df;
  border-radius: var(--radius-control);
  outline: none;
  background: #fbfdfb;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  transition: border-color .2s var(--ease-out-expo),
              box-shadow .2s var(--ease-out-expo),
              background .2s var(--ease-out-expo),
              transform .2s var(--ease-out-back);
}
input::placeholder, textarea::placeholder { color: #a1ada5; font-weight: 500; }
input:hover, select:hover, textarea:hover { border-color: #bdcfc2; }
input:focus, select:focus, textarea:focus {
  border-color: #31835d;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(49, 131, 93, .12);
  transform: translateY(-1px);
}
input:disabled, select:disabled, textarea:disabled {
  cursor: not-allowed;
  opacity: .65;
}
select { cursor: pointer; }
textarea { min-height: 66px; resize: vertical; line-height: 1.5; }

.filters {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.filters > div { min-width: 0; }

/* ============================================
   BUTTONS — with press feedback
   ============================================ */
button.primary, button.ghost, button.small {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 39px;
  font-family: 'Nunito', Arial, sans-serif;
  font-size: 12px;
  font-weight: 900;
  letter-spacing: .25px;
  cursor: pointer;
  transition: transform .18s var(--ease-out-back),
              box-shadow .18s var(--ease-out-expo),
              background .18s ease,
              border-color .18s ease;
  position: relative;
  overflow: hidden;
}
button.primary {
  padding: 11px 19px;
  border: 1px solid #176345;
  border-radius: 11px;
  background: linear-gradient(135deg, #237b55, #145b3d);
  color: #fff;
  box-shadow: 0 4px 10px rgba(23, 99, 69, .16);
}
button.primary::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(255,255,255,.25), transparent 60%);
  opacity: 0;
  transition: opacity .35s ease;
  pointer-events: none;
}
button.primary:active::after { opacity: 1; transition: opacity 0s; }
button.primary:hover {
  background: linear-gradient(135deg, #2b8960, #176345);
  box-shadow: 0 8px 20px rgba(23, 99, 69, .26);
  transform: translateY(-2px);
}
button.primary:active { transform: translateY(0) scale(.98); box-shadow: 0 2px 5px rgba(23, 99, 69, .15); }
button.ghost {
  padding: 9px 15px;
  border: 1px solid #c9ddcf;
  border-radius: 10px;
  background: #f7fbf8;
  color: var(--navy);
}
button.ghost:hover { border-color: #8eb99c; background: #edf6ef; transform: translateY(-1px); }
button.ghost:active { transform: translateY(0) scale(.97); }
button.small {
  min-height: 30px;
  padding: 5px 10px;
  border: 1px solid #c9ddcf;
  border-radius: 8px;
  background: #f7fbf8;
  color: var(--navy);
  font-size: 11px;
}
button.small:hover { border-color: #8eb99c; background: #edf6ef; transform: translateY(-1px); }
button.small:active { transform: translateY(0) scale(.96); }
button:focus-visible {
  outline: 3px solid rgba(49, 131, 93, .28);
  outline-offset: 2px;
}
.load-btn-row { margin-top: 16px; }
.save-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

.error-msg {
  display: none;
  margin: 0 0 16px;
  padding: 11px 13px;
  border: 1px solid #f3d0cd;
  border-radius: 10px;
  background: var(--fail-bg);
  color: var(--fail);
  font-size: 12px;
  font-weight: 800;
  animation: shake .4s var(--ease-out-expo);
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25%      { transform: translateX(-4px); }
  75%      { transform: translateX(4px); }
}
.empty-note {
  padding: 38px 16px;
  border: 1px dashed #d5e2d9;
  border-radius: 13px;
  background: #fbfdfb;
  color: var(--text-soft);
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  animation: fadeUp .5s var(--ease-out-expo) both;
}

/* ============================================
   STUDENT ROWS — staggered reveal
   ============================================ */
.student-row {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 19px 0;
  border-bottom: 1px solid #edf1ee;
  animation: rowArrive .45s var(--ease-out-expo) both;
  animation-delay: calc(var(--i, 0) * 55ms);
}
@keyframes rowArrive {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.student-row:first-child { padding-top: 5px; }
.student-row:last-child { border-bottom: none; padding-bottom: 4px; }
.avatar-wrap { position: relative; flex: 0 0 58px; }
.avatar {
  display: flex;
  width: 56px;
  height: 56px;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border: 2px solid #e1eee5;
  border-radius: 16px;
  background: linear-gradient(145deg, #e7f3ea, #d5e9db);
  color: #176345;
  font-size: 16px;
  font-weight: 900;
  transition: transform .25s var(--ease-out-back), box-shadow .25s ease;
}
.avatar:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(23,99,69,.15); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.photo-input { display: none; }
.photo-btn {
  display: block;
  margin-top: 7px;
  color: var(--navy);
  font-size: 10px;
  font-weight: 900;
  text-align: center;
  cursor: pointer;
  transition: color .15s ease;
}
.photo-btn:hover { color: #0e4932; text-decoration: underline; }
.student-fields { flex: 1; min-width: 0; }
.student-fields .name {
  margin: 0 0 11px;
  color: #203b2d;
  font-size: 14px;
  font-weight: 900;
  line-height: 1.35;
}
.attendance-row {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}
.attendance-row > div { flex: 1 1 0; min-width: 0; }
.attendance-row label { margin-bottom: 5px; font-size: 9px; }
.attendance-row input { padding: 8px 10px; font-size: 12px; }
.student-fields textarea { margin-bottom: 7px; }

/* ============================================
   TOAST — animated in/out with progress bar
   ============================================ */
.toast {
  position: fixed;
  z-index: 1000;
  right: 20px;
  bottom: 22px;
  left: 20px;
  width: fit-content;
  max-width: min(520px, calc(100% - 40px));
  margin: 0 auto;
  padding: 14px 20px 14px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 12px;
  background: #183f2e;
  color: #fff;
  box-shadow: 0 16px 40px rgba(14, 48, 31, .28);
  font-size: 13px;
  font-weight: 800;
  text-align: center;
  overflow: hidden;
  display: none;
}
.toast.show {
  display: block;
  animation: toastIn .45s var(--ease-out-back) both;
}
.toast.hide {
  animation: toastOut .3s var(--ease-out-expo) both;
}
@keyframes toastIn {
  0%   { opacity: 0; transform: translateY(24px) scale(.92); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes toastOut {
  0%   { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(12px) scale(.96); }
}
.toast::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: 0;
  height: 2px;
  width: 100%;
  background: rgba(255,255,255,.35);
  transform-origin: left;
  animation: toastTimer 2.5s linear both;
}
@keyframes toastTimer {
  from { transform: scaleX(1); }
  to   { transform: scaleX(0); }
}

/* ============================================
   BROADSHEET & SLIPS (unchanged semantics)
   ============================================ */
#broadsheetCard, #allSlipsCard { overflow: hidden; }
#broadsheetCard.view-enter, #allSlipsCard.view-enter, #rosterCard.view-enter {
  animation: viewSwap .5s var(--ease-out-expo) both;
}
@keyframes viewSwap {
  from { opacity: 0; transform: translateY(16px) scale(.985); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
#broadsheetTable {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  color: #26372d;
  font-size: 11px;
}
#broadsheetTable th {
  padding: 11px 9px;
  background: #edf5ef;
  color: #315542;
  font-size: 10px;
  font-weight: 900;
  text-align: left;
  white-space: nowrap;
}
#broadsheetTable td {
  padding: 10px 9px;
  border-bottom: 1px solid #e9efeb;
  background: #fff;
  vertical-align: middle;
}
#broadsheetTable tr:nth-child(even) td { background: #fafcfb; }
#broadsheetTable tr:last-child td { border-bottom: none; }
#broadsheetCard { overflow-x: auto; }
.result-slip-page {
  margin: 0 0 18px;
  padding: 24px;
  border: 1px solid #dfe8e1;
  border-radius: 14px;
  background: #fff;
  color: #24352a;
  box-shadow: var(--shadow-sm);
  animation: rowArrive .5s var(--ease-out-expo) both;
  animation-delay: calc(var(--i, 0) * 80ms);
}
.result-slip-page table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
}
.result-slip-page th, .result-slip-page td {
  padding: 8px 9px;
  border: 1px solid #dfe7e0;
  text-align: left;
}
.result-slip-page th { background: #edf5ef; color: #315542; font-weight: 900; }
.result-slip-page h1, .result-slip-page h2, .result-slip-page h3 {
  color: #183f2e;
  font-family: 'Baloo 2', sans-serif;
}

@media (min-width: 760px) {
  #appWrap > .card:first-of-type { padding: 25px 28px; }
}
@media (max-width: 600px) {
  body { padding: 20px 12px 56px; }
  .wrap, .wrap.narrow { width: 100%; }
  .school-header { margin-bottom: 19px; }
  .school-header .crest { width: 52px; height: 52px; border-radius: 16px; }
  .school-header h1 { font-size: 22px; }
  .card { padding: 17px; margin-bottom: 14px; border-radius: 15px; }
  #loginWrap .card { padding: 22px 19px; }
  .topbar { margin-bottom: 16px; }
  .filters { gap: 11px; }
  .student-row { gap: 11px; padding: 16px 0; }
  .avatar-wrap { flex-basis: 48px; }
  .avatar { width: 46px; height: 46px; border-radius: 13px; font-size: 14px; }
  .student-fields .name { font-size: 13px; }
  .attendance-row { gap: 7px; }
  .attendance-row input { padding: 8px 7px; font-size: 11px; }
  .save-row button { flex: 1 1 140px; }
  #broadsheetCard { padding: 14px; }
  #broadsheetTable { min-width: 620px; }
  .result-slip-page { padding: 15px; }
  .dash-greeting { flex-direction: column; align-items: flex-start; padding: 14px 16px; gap: 4px; }
  .dash-greeting .greet-sub { white-space: normal; }
}
@media (max-width: 390px) {
  body { padding-right: 9px; padding-left: 9px; }
  .filters { grid-template-columns: 1fr; }
  .card { padding: 14px; }
  .student-row { gap: 9px; }
  .attendance-row { gap: 6px; }
  .attendance-row input { padding: 7px 5px; font-size: 10px; }
  .photo-btn { font-size: 9px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}
@media print {
  @page { size: A4 portrait; margin: 12mm; }
  html, body {
    min-height: 0;
    padding: 0 !important;
    background: #fff !important;
    color: #111 !important;
    font-family: Arial, sans-serif;
    font-size: 10pt;
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .wrap { width: 100% !important; max-width: none !important; }
  #loginWrap, .topbar, .filters, .load-btn-row, #rosterCard, #emptyNote, .toast, .dash-greeting {
    display: none !important;
  }
  #broadsheetCard, #allSlipsCard {
    overflow: visible !important;
    border: none !important;
    padding: 0 !important;
    margin: 0 !important;
    box-shadow: none !important;
  }
  #broadsheetTable { width: 100% !important; font-size: 8pt !important; }
  #broadsheetTable th, #broadsheetTable td {
    padding: 5px 4px !important;
    border: 1px solid #bbb !important;
    color: #111 !important;
  }
  .result-slip-page {
    page-break-after: always;
    break-after: page;
    border: none !important;
    border-radius: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
    box-shadow: none !important;
  }
  .result-slip-page:last-child { page-break-after: auto; break-after: auto; }
  .result-slip-page table { font-size: 9pt !important; }
  .result-slip-page th, .result-slip-page td {
    border: 1px solid #888 !important;
    color: #111 !important;
  }
}
</style>
</head>
<body>

<div class="wrap narrow" id="loginWrap">
  <div class="school-header">
    <div class="crest" id="loginCrest">GS</div>
    <h1 id="loginSchoolName">School Portal</h1>
    <p>Form teacher login</p>
  </div>
  <div class="card">
    <div class="error-msg" id="loginError"></div>
        
    <label for="teacherEmail">Email</label>
    <input type="email" id="teacherEmail" placeholder="e.g. adeyemi@school.com" />
    <label for="teacherPassword" style="margin-top:12px;">Password</label>
    <div style="position:relative; margin-bottom:16px;">
      <input type="password" id="teacherPassword" style="padding-right:64px;" />
      <button type="button" onclick="togglePasswordVisibility('teacherPassword', this)" style="position:absolute; right:6px; top:50%; transform:translateY(-50%); width:auto; padding:4px 10px; font-size:10px; background:var(--cream); color:var(--navy); box-shadow:none; border:1px solid var(--border); border-radius:8px; text-transform:none; font-family:'Nunito',Arial,sans-serif; font-weight:700;">Show</button>
    </div>
    <button class="primary" style="width:100%;" onclick="login()">Log in</button>
  </div>
</div>

<div class="wrap" id="appWrap" style="display:none;">

  <div class="school-header">
    <div class="crest" id="appCrest">GS</div>
    <h1 id="appSchoolName">School Portal</h1>
    <p>Attendance, comments &amp; student photos</p>
  </div>

  <div class="card">
    <div class="dash-greeting" id="dashGreeting">
      <span class="greet-line" id="greetLine">Welcome back</span>
      <span class="greet-sub" id="greetSub"><span class="dot"></span>Logged in as <span id="whoAmISubtle">—</span></span>
    </div>

    <div class="topbar">
      <span class="who" id="whoAmI"></span>
      <button onclick="logout()">Log out</button>
      <button onclick="openPasswordModal()" style="margin-right: 8px; background: var(--sec-btn-bg); color: var(--navy); border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; cursor: pointer;">Change Password</button>
    </div>

    <div class="filters">
      <div>
        <label for="termSelect">Term</label>
        <select id="termSelect">
          <option>First Term</option>
          <option>Second Term</option>
          <option>Third Term</option>
        </select>
      </div>
      <div>
        <label for="sessionInput">Session</label>
        <input type="text" id="sessionInput" />
      </div>
    </div>

    <div class="load-btn-row" style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="primary" onclick="loadRoster()">Load my class</button>
      <button class="ghost" onclick="loadBroadsheet()">View broadsheet</button>
      <button class="ghost" onclick="loadAllResultSlips()">Print all result slips</button>
    </div>
  </div>

  <div class="card" id="rosterCard" style="display:none;">
    <div id="studentList"></div>
    <div class="save-row">
      <button class="primary" onclick="saveAll()">Save all</button>
    </div>
  </div>

  <div class="card" id="broadsheetCard" style="display:none;">
    <div class="topbar" style="margin-bottom:14px;">
      <span class="who" id="broadsheetTitle"></span>
      <span>
        <select id="broadsheetSort" onchange="resortBroadsheet()" style="width:auto; padding:6px 8px; font-size:12px; margin-right:8px;">
          <option value="name">Sort: Name (A-Z)</option>
          <option value="position">Sort: Position (1st first)</option>
        </select>
        <button onclick="window.print()">Print</button>
      </span>
    </div>
    <div style="overflow-x:auto;">
      <table id="broadsheetTable" style="width:100%; border-collapse:collapse; font-size:12px; min-width:600px;"></table>
    </div>
  </div>

  <div class="card" id="allSlipsCard" style="display:none;">
    <div class="topbar" style="margin-bottom:14px;">
      <span class="who" id="allSlipsTitle"></span>
      <button onclick="window.print()">Print / Save as PDF</button>
    </div>
    <div id="allSlipsContainer"></div>
  </div>

  <div class="empty-note" id="emptyNote" style="display:none;">
    You are not set up as the form teacher for any class yet, or that class has no students.
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
    // Auto-read school code from the Gateway URL
  const urlParams = new URLSearchParams(window.location.search);
  const urlSchoolCode = urlParams.get('school');
  if (urlSchoolCode) {
    window.hiddenSchoolCode = urlSchoolCode.toUpperCase();
  }
  const API_BASE = window.location.origin;
  let teacher = null;
  let myClass = null;
  let currentRoster = [];
  let globalSchoolSettings = null;
  let greetingClockTimer = null;

  /* ==========================================================
     GREETING — computed from local time, updates live
     ========================================================== */
  function getGreetingFor(hour) {
    if (hour >= 5  && hour < 12) return 'Good morning';
    if (hour >= 12 && hour < 17) return 'Good afternoon';
    if (hour >= 17 && hour < 22) return 'Good evening';
    return 'Welcome back';
  }

  function updateGreeting() {
    if (!teacher || !teacher.name) return;
    const firstName = teacher.name.trim().split(/\s+/)[0];
    const phrase = getGreetingFor(new Date().getHours());

    const lineEl = document.getElementById('greetLine');
    const subtleEl = document.getElementById('whoAmISubtle');
    const whoEl = document.getElementById('whoAmI');

    const newLine = `${phrase}, ${firstName}!`;
    // Only re-animate when the phrase actually changes
    if (lineEl && lineEl.textContent !== newLine) {
      lineEl.textContent = newLine;
      lineEl.style.animation = 'none';
      void lineEl.offsetWidth;
      lineEl.style.animation = '';
    }
    if (subtleEl) subtleEl.textContent = teacher.name;
    if (whoEl) whoEl.textContent = `Logged in as ${teacher.name}`;
  }

  function startGreetingClock() {
    updateGreeting();
    if (greetingClockTimer) clearInterval(greetingClockTimer);
    // Check every 60s — cheap, and catches the hour boundary
    greetingClockTimer = setInterval(updateGreeting, 60_000);
  }

  /* ==========================================================
     TOAST — queued, animated, self-cleaning
     ========================================================== */
  let toastHideTimer = null;
  let toastResetTimer = null;

  function showToast(message) {
    const t = document.getElementById('toast');
    if (!t) return;

    // cancel any in-flight hide/reset
    clearTimeout(toastHideTimer);
    clearTimeout(toastResetTimer);

    t.textContent = message;
    t.classList.remove('hide', 'show');
    // force reflow so the animation restarts cleanly
    void t.offsetWidth;
    t.classList.add('show');

    toastHideTimer = setTimeout(() => {
      t.classList.remove('show');
      t.classList.add('hide');
      toastResetTimer = setTimeout(() => {
        t.classList.remove('hide');
        t.style.display = 'none';
      }, 320);
    }, 2500);
  }

  /* ==========================================================
     SCHOOL SETTINGS / SESSION
     ========================================================== */
    async function fetchInitialSchoolSettings() {
    // Only fetch settings if we have a school code in the URL
    const code = window.hiddenSchoolCode;
    if (!code) return; 

    try {
      // First find the school ID by the code
      const lookup = await fetch(`${API_BASE}/api/developer/public/school-lookup?code=${code}`);
      if (!lookup.ok) return;
      const lookupData = await lookup.json();
      
      // Then fetch the settings for that school ID
      const res = await fetch(`${API_BASE}/api/settings?school_id=${lookupData.school.id}`);
      const data = await res.json();
      if (data.settings) updateSchoolHeader(data.settings);
    } catch (err) {
      console.error('Could not load school settings for header:', err);
    }
  }
  fetchInitialSchoolSettings();

  async function loadActiveSession() {
    try {
      const res = await fetch(`${API_BASE}/api/form-teacher/active-session`);
      const data = await res.json();
      if (data.session) document.getElementById('sessionInput').value = data.session;
      if (data.term)   document.getElementById('termSelect').value = data.term;
    } catch (err) {
      console.error('Could not load active session/term:', err);
    }
  }

  const saved = sessionStorage.getItem('resultpro_teacher');
  if (saved) {
    teacher = JSON.parse(saved);
    boot();
  }

  /* ==========================================================
     HELPERS
     ========================================================== */
  function getInitials(name) {
    return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  }
  function getPhotoUrl(photoUrl) {
    if (!photoUrl) return '';
    if (photoUrl.startsWith('http://') || photoUrl.startsWith('https://')) return photoUrl;
    return `${API_BASE}${photoUrl}`;
  }
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') { input.type = 'text'; btn.textContent = 'Hide'; }
    else { input.type = 'password'; btn.textContent = 'Show'; }
  }

  /* ==========================================================
     AUTH
     ========================================================== */
  a  async function login() {
    const email = document.getElementById('teacherEmail').value.trim();
    const password = document.getElementById('teacherPassword').value;
    const school_code = window.hiddenSchoolCode || '';
    const errEl = document.getElementById('loginError');
    
    errEl.style.display = 'none';

    if (!email || !password) {
      errEl.textContent = 'Please enter both email and password.';
      errEl.style.display = 'block';
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/form-teacher/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          email: email, 
          password: password, 
          school_code: school_code 
        }),
      });
      
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');

      teacher = data.teacher;
      sessionStorage.setItem('resultpro_teacher', JSON.stringify(teacher));
      boot();
    } catch (err) {
      errEl.textContent = err.message || 'Login failed.';
      errEl.style.display = 'block';
    }
  }

  function logout() {
    sessionStorage.removeItem('resultpro_teacher');
    if (greetingClockTimer) clearInterval(greetingClockTimer);
    teacher = null;
    document.getElementById('appWrap').style.display = 'none';
    document.getElementById('loginWrap').style.display = 'block';
  }

  async function boot() {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('appWrap').style.display = 'block';
    startGreetingClock();

    await loadActiveSession();

    try {
      const res = await fetch(`${API_BASE}/api/form-teacher/my-class?teacher_id=${teacher.id}`);
      const data = await res.json();
      myClass = data.class;
      if (!myClass) document.getElementById('emptyNote').style.display = 'block';
    } catch (err) {
      showToast('Could not check your class assignment.');
    }
  }

  /* ==========================================================
     VIEW SWAP — replays entrance animation for the active card
     ========================================================== */
  function enterView(cardId) {
    const card = document.getElementById(cardId);
    if (!card) return;
    card.classList.remove('view-enter');
    void card.offsetWidth;
    card.classList.add('view-enter');
  }

  /* ==========================================================
     ROSTER
     ========================================================== */
  async function loadRoster() {
    if (!myClass) { showToast('You are not assigned as a form teacher for any class.'); return; }
    const term = document.getElementById('termSelect').value;
    const session = document.getElementById('sessionInput').value.trim();
    if (!session) { showToast('Please enter a session.'); return; }

    try {
      const res = await fetch(
        `${API_BASE}/api/form-teacher/roster?class=${encodeURIComponent(myClass)}&term=${encodeURIComponent(term)}&session=${encodeURIComponent(session)}&teacher_id=${teacher.id}`
      );
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load class');

      currentRoster = data.roster || [];
      if (currentRoster.length === 0) {
        document.getElementById('rosterCard').style.display = 'none';
        document.getElementById('emptyNote').style.display = 'block';
        return;
      }
      document.getElementById('emptyNote').style.display = 'none';
      renderRoster();
      enterView('rosterCard');
    } catch (err) {
      showToast(err.message || 'Could not load class.');
    }
  }

  function renderRoster() {
    document.getElementById('rosterCard').style.display = 'block';
    const list = document.getElementById('studentList');

    list.innerHTML = currentRoster.map((s, i) => `
      <div class="student-row" style="--i:${i}">
        <div class="avatar-wrap">
          <div class="avatar" id="avatar-${i}">
            ${s.photo_url ? `<img src="${getPhotoUrl(s.photo_url)}" alt="${s.name}" />` : getInitials(s.name)}
          </div>
          <label class="photo-btn" for="photoFile-${i}">Change photo</label>
          <input class="photo-input" type="file" id="photoFile-${i}" accept="image/png, image/jpeg, image/webp"
                 onchange="uploadPhoto(${i})" />
        </div>
        <div class="student-fields">
          <p class="name">${s.name}</p>
          <div class="attendance-row">
            <div>
              <label>Total days</label>
              <input type="number" min="0" id="total-${i}" value="${s.total_days ?? ''}" oninput="calculateAttendance(${i})" />
            </div>
            <div>
              <label>Present</label>
              <input type="number" min="0" id="present-${i}" value="${s.times_present ?? ''}" oninput="calculateAttendance(${i})" />
            </div>
            <div>
              <label>Absent</label>
              <input type="number" min="0" id="absent-${i}" value="${s.times_absent ?? ''}" readonly style="background-color: #e9ecef; cursor: not-allowed;" />
            </div>
          </div>
          <label>Form teacher's comment</label>
          <textarea id="comment-${i}" placeholder="e.g. Diligent but needs to work harder on mathematics.">${s.form_teacher_comment ?? ''}</textarea>
        </div>
      </div>
    `).join('');
  }

  function calculateAttendance(i) {
    const total = parseInt(document.getElementById(`total-${i}`).value, 10);
    const present = parseInt(document.getElementById(`present-${i}`).value, 10);
    const absentEl = document.getElementById(`absent-${i}`);
    if (!isNaN(total) && !isNaN(present)) {
      const absent = total - present;
      absentEl.value = absent >= 0 ? absent : 0;
    } else {
      absentEl.value = '';
    }
  }

  async function uploadPhoto(i) {
    const fileInput = document.getElementById(`photoFile-${i}`);
    const file = fileInput.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append('photo', file);
    formData.append('student_id', currentRoster[i].student_id);
    formData.append('class', myClass);
    formData.append('teacher_id', teacher.id);

    try {
      const res = await fetch(`${API_BASE}/api/form-teacher/upload-photo`, {
        method: 'POST',
        body: formData,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Photo upload failed');

      currentRoster[i].photo_url = data.photo_url;
      document.getElementById(`avatar-${i}`).innerHTML = `<img src="${getPhotoUrl(data.photo_url)}" alt="" />`;
      showToast('Photo updated.');
    } catch (err) {
      showToast(err.message || 'Could not upload photo.');
    }
  }

  /* ==========================================================
     RESULT SLIPS
     ========================================================== */
  async function loadAllResultSlips() {
    if (!myClass) { showToast('You are not assigned as a form teacher for any class.'); return; }
    const term = document.getElementById('termSelect').value;
    const session = document.getElementById('sessionInput').value.trim();
    if (!session) { showToast('Please enter a session.'); return; }

    try {
      const res = await fetch(
        `${API_BASE}/api/form-teacher/class-result-slips?class=${encodeURIComponent(myClass)}&term=${encodeURIComponent(term)}&session=${encodeURIComponent(session)}&teacher_id=${teacher.id}`
      );
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load result slips');

      if (!data.slips || data.slips.length === 0) {
        showToast('No students or scores found for this class/term/session yet.');
        return;
      }

      document.getElementById('rosterCard').style.display = 'none';
      document.getElementById('broadsheetCard').style.display = 'none';
      document.getElementById('emptyNote').style.display = 'none';
      document.getElementById('allSlipsCard').style.display = 'block';
      document.getElementById('allSlipsTitle').textContent = `${data.class} — ${data.term}, ${data.session} — ${data.slips.length} students`;
      renderAllResultSlips(data);
      enterView('allSlipsCard');
    } catch (err) {
      showToast(err.message || 'Could not load result slips.');
    }
  }

  function renderAllResultSlips(data) {
    const container = document.getElementById('allSlipsContainer');
    container.innerHTML = data.slips.map((slip, idx) => {
      const s = slip.student;
      const avatar = s.photo_url
        ? `<img src="${getPhotoUrl(s.photo_url)}" alt="${s.name}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`
        : getInitials(s.name);

      let schoolHeaderHtml = '';
      if (globalSchoolSettings) {
        const gs = globalSchoolSettings;
        const crest = gs.logo_url
          ? `<img src="${getPhotoUrl(gs.logo_url)}" alt="Logo" style="width:100%;height:100%;object-fit:cover;" />`
          : getInitials(gs.school_name);

        let detailsParts = [];
        if (gs.school_address) detailsParts.push(gs.school_address);
        if (gs.school_phone) detailsParts.push(`Phone: ${gs.school_phone}`);
        if (gs.school_email) detailsParts.push(`Email: ${gs.school_email}`);

        schoolHeaderHtml = `
          <div style="text-align:center; margin-bottom:14px; padding-bottom:10px; border-bottom:2px solid var(--border);">
            <div style="width:40px; height:40px; border-radius:50%; background:var(--navy); color:var(--gold); display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px; margin:0 auto 6px; overflow:hidden;">${crest}</div>
            <h2 style="font-size:16px; font-weight:800; margin:0; font-family:'Baloo 2',sans-serif;">${gs.school_name}</h2>
            ${gs.motto ? `<p style="font-size:11px; color:var(--text-soft); margin:2px 0;">${gs.motto}</p>` : ''}
            ${detailsParts.length > 0 ? `<p style="font-size:10px; color:var(--text-soft); margin:2px 0;">${detailsParts.join(' &middot; ')}</p>` : ''}
          </div>`;
      }

      const subjectRows = slip.subjects.map(sub => `
        <tr>
          <td style="padding:6px 4px; border-bottom:1px solid var(--border);">${sub.subject_name}</td>
          <td style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border);">${sub.ca}</td>
          <td style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border);">${sub.exam}</td>
          <td style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border); font-weight:bold;">${sub.total}</td>
          <td style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border);">${sub.highest ?? '—'}</td>
          <td style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border);">${sub.position}</td>
          <td style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border);"><span style="background:var(--pass-bg); color:var(--pass); padding:1px 7px; border-radius:6px; font-weight:bold; font-size:11px;">${sub.grade || '—'}</span></td>
        </tr>`).join('');

      const commentsHtml = (slip.comments && (slip.comments.form_teacher || slip.comments.principal)) ? `
        <div style="border-top:1px solid var(--border); margin-top:14px; padding-top:12px;">
          ${slip.comments.form_teacher ? `<p style="font-size:11px; color:var(--text-soft); margin:0 0 4px; text-transform:uppercase;">Form teacher's comment</p><p style="font-size:13px; margin:0 0 10px;">${slip.comments.form_teacher}</p>` : ''}
          ${slip.comments.principal ? `<p style="font-size:11px; color:var(--text-soft); margin:0 0 4px; text-transform:uppercase;">Principal's comment</p><p style="font-size:13px; margin:0;">${slip.comments.principal}</p>` : ''}
        </div>` : '';

      return `
        <div class="result-slip-page" style="--i:${idx}; border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:20px;">
          ${schoolHeaderHtml}

          <div style="display:flex; align-items:center; gap:12px; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border);">
            <div style="width:48px; height:48px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px; overflow:hidden; flex-shrink:0;">${avatar}</div>
            <div>
              <p style="font-weight:bold; font-size:15px; margin:0;">${s.name}</p>
              <p style="font-size:12px; color:var(--text-soft); margin:2px 0 0;">${data.class} &middot; Admission no. ${s.admission_no} &middot; ${data.term}, ${data.session}</p>
            </div>
          </div>

          <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin-bottom:14px;">
            <div style="background:var(--cream); border-radius:10px; padding:8px 10px;"><p style="font-size:10px; color:var(--text-soft); margin:0;">Total</p><p style="font-size:14px; font-weight:bold; margin:2px 0 0;">${slip.summary.total_score}/${slip.summary.max_obtainable}</p></div>
            <div style="background:var(--cream); border-radius:10px; padding:8px 10px;"><p style="font-size:10px; color:var(--text-soft); margin:0;">Average</p><p style="font-size:14px; font-weight:bold; margin:2px 0 0;">${slip.summary.average}%</p></div>
            <div style="background:var(--cream); border-radius:10px; padding:8px 10px;"><p style="font-size:10px; color:var(--text-soft); margin:0;">Position</p><p style="font-size:14px; font-weight:bold; margin:2px 0 0;">${slip.summary.class_position} of ${slip.summary.class_size}</p></div>
            <div style="background:var(--cream); border-radius:10px; padding:8px 10px;"><p style="font-size:10px; color:var(--text-soft); margin:0;">Attendance</p><p style="font-size:14px; font-weight:bold; margin:2px 0 0;">${slip.attendance ? `${slip.attendance.present}/${slip.attendance.total_days}` : '—'}</p></div>
          </div>

          <table style="width:100%; border-collapse:collapse; font-size:12px;">
            <thead>
              <tr>
                <th style="text-align:left; padding:6px 4px; border-bottom:1px solid var(--border); color:var(--text-soft); font-size:11px;">Subject</th>
                <th style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border); color:var(--text-soft); font-size:11px;">CA</th>
                <th style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border); color:var(--text-soft); font-size:11px;">Exam</th>
                <th style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border); color:var(--text-soft); font-size:11px;">Total</th>
                <th style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border); color:var(--text-soft); font-size:11px;">Highest</th>
                <th style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border); color:var(--text-soft); font-size:11px;">Pos</th>
                <th style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border); color:var(--text-soft); font-size:11px;">Grade</th>
              </tr>
            </thead>
            <tbody>${subjectRows}</tbody>
          </table>

          ${commentsHtml}
        </div>`;
    }).join('');
  }

  /* ==========================================================
     BROADSHEET
     ========================================================== */
  async function loadBroadsheet() {
    if (!myClass) { showToast('You are not assigned as a form teacher for any class.'); return; }
    const term = document.getElementById('termSelect').value;
    const session = document.getElementById('sessionInput').value.trim();
    if (!session) { showToast('Please enter a session.'); return; }

    try {
      const res = await fetch(
        `${API_BASE}/api/form-teacher/broadsheet?class=${encodeURIComponent(myClass)}&term=${encodeURIComponent(term)}&session=${encodeURIComponent(session)}&teacher_id=${teacher.id}`
      );
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to load broadsheet');

      if (!data.rows || data.rows.length === 0) {
        document.getElementById('broadsheetCard').style.display = 'none';
        showToast('No students or scores found for this class/term/session yet.');
        return;
      }

      lastBroadsheetData = data;
      document.getElementById('rosterCard').style.display = 'none';
      document.getElementById('emptyNote').style.display = 'none';
      document.getElementById('broadsheetCard').style.display = 'block';
      document.getElementById('broadsheetTitle').textContent = `${data.class} — ${data.term}, ${data.session}`;
      renderBroadsheet(data);
      enterView('broadsheetCard');
    } catch (err) {
      showToast(err.message || 'Could not load broadsheet.');
    }
  }

  let lastBroadsheetData = null;

  function resortBroadsheet() {
    if (!lastBroadsheetData) return;
    renderBroadsheet(lastBroadsheetData);
  }

  function renderBroadsheet(data) {
    const sortMode = document.getElementById('broadsheetSort').value;
    const sortedRows = [...data.rows].sort((a, b) => {
      if (sortMode === 'position') return a.class_position_rank - b.class_position_rank;
      return a.name.localeCompare(b.name);
    });

    const table = document.getElementById('broadsheetTable');
    const subjectHeaders = data.subjects.map(s => `<th style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border); font-size:10px;">${s.name}</th>`).join('');

    const headerRow = `
      <tr>
        <th style="text-align:left; padding:6px 4px; border-bottom:1px solid var(--border);">Student</th>
        ${subjectHeaders}
        <th style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border);">Total</th>
        <th style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border);">Avg</th>
        <th style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border);">Position</th>
      </tr>`;

    const bodyRows = sortedRows.map(r => {
      const subjectCells = r.subject_scores.map(sc => `
        <td style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border);">
          ${sc.total !== null ? `${sc.total} <span style="color:var(--text-soft); font-size:10px;">(${sc.grade})</span>` : '—'}
        </td>`).join('');
      return `
        <tr>
          <td style="padding:6px 4px; border-bottom:1px solid var(--border); font-weight:bold;">${r.name}</td>
          ${subjectCells}
          <td style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border); font-weight:bold;">${r.total_score} / ${r.max_obtainable}</td>
          <td style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border);">${r.average}%</td>
          <td style="text-align:right; padding:6px 4px; border-bottom:1px solid var(--border);">${r.class_position}</td>
        </tr>`;
    }).join('');

    table.innerHTML = headerRow + bodyRows;
  }

  /* ==========================================================
     SAVE
     ========================================================== */
  async function saveAll() {
    const term = document.getElementById('termSelect').value;
    const session = document.getElementById('sessionInput').value.trim();

    const records = currentRoster.map((s, i) => ({
      student_id: s.student_id,
      times_present: document.getElementById('present-' + i).value === '' ? null : Number(document.getElementById('present-' + i).value),
      times_absent: document.getElementById('absent-' + i).value === '' ? null : Number(document.getElementById('absent-' + i).value),
      total_days: document.getElementById('total-' + i).value === '' ? null : Number(document.getElementById('total-' + i).value),
      form_teacher_comment: document.getElementById('comment-' + i).value.trim() || null,
    }));

    try {
      const res = await fetch(`${API_BASE}/api/form-teacher/term-records`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ class: myClass, term, session, teacher_id: teacher.id, records }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Save failed');
      showToast('Saved for the whole class.');
    } catch (err) {
      showToast(err.message || 'Could not save.');
    }
  }
</script>
<!-- PASSWORD MODAL -->
<div id="passwordModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999; align-items: center; justify-content: center; padding: 20px;">
  <div style="background: var(--card); width: 100%; max-width: 400px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
    <h3 style="margin: 0 0 16px; font-family: 'Baloo 2', sans-serif; color: var(--text);">Change Password</h3>
    
    <label style="font-size: 11px; font-weight: 800; color: var(--text-soft); text-transform: uppercase;">Current Password</label>
    <input type="password" id="currentPass" style="width: 100%; margin-bottom: 12px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg); color: var(--text);" />
    
    <label style="font-size: 11px; font-weight: 800; color: var(--text-soft); text-transform: uppercase;">New Password</label>
    <input type="password" id="newPass" style="width: 100%; margin-bottom: 12px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg); color: var(--text);" />
    
    <label style="font-size: 11px; font-weight: 800; color: var(--text-soft); text-transform: uppercase;">Confirm New Password</label>
    <input type="password" id="confirmPass" style="width: 100%; margin-bottom: 20px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--input-bg); color: var(--text);" />
    
    <div style="display: flex; gap: 10px;">
      <button onclick="document.getElementById('passwordModal').style.display='none'" style="flex: 1; padding: 10px; border: 1px solid var(--border); background: transparent; color: var(--text); border-radius: 8px; cursor: pointer; font-weight: bold;">Cancel</button>
      <button onclick="submitPasswordChange()" class="primary" style="flex: 1; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold;">Save</button>
    </div>
  </div>
</div>

<script>
  function openPasswordModal() {
    document.getElementById('passwordModal').style.display = 'flex';
    document.getElementById('currentPass').value = '';
    document.getElementById('newPass').value = '';
    document.getElementById('confirmPass').value = '';
  }

  async function submitPasswordChange() {
    const currentPass = document.getElementById('currentPass').value;
    const newPass = document.getElementById('newPass').value;
    const confirmPass = document.getElementById('confirmPass').value;

    if (!currentPass || !newPass || !confirmPass) return showToast('Please fill all fields.');
    if (newPass !== confirmPass) return showToast('New passwords do not match.');
    if (newPass.length < 6) return showToast('New password must be at least 6 characters.');

    try {
      const res = await fetch(`${API_BASE}/api/teacher/change-password`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          teacher_id: teacher.id, 
          current_password: currentPass, 
          new_password: newPass 
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      
      showToast('Password changed successfully!');
      document.getElementById('passwordModal').style.display = 'none';
    } catch (err) {
      showToast(err.message || 'Failed to change password.');
    }
  }
</script>
